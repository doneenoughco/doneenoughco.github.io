<style>/* Done Enough Subscriptions: screen styles (from the Done Enough Budget design system). Light + dark via tokens; colour is never the only signal (icons + words too). */
:root {
  --bg: #F3EDE4; --surface: #ffffff; --surface-2: #faf7f2; --line: #e6ddcf; --line-2: #d8cebf;
  --ink: #2F3437; --ink-2: #555c60; --ink-3: #60676b;
  --primary: #3F716C; --primary-ink: #ffffff; --primary-soft: #e3eeec; --primary-text: #2f625d;
  --accent: #E9A87C; --accent-soft: #f9e3d3; --butter: #F2D98B; --butter-soft: #fbf3d8;
  --warn-ink: #7a5310; --warn-soft: #fbf0d3; --over-ink: #9a3f2b; --over-soft: #f8e1d9; --ok-ink: #2f625d; --ok-soft: #e3eeec;
  --focus: #c76a2c; --shadow: 0 1px 2px rgba(47,52,55,.06), 0 6px 22px rgba(47,52,55,.07); --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181c1e; --surface: #22282b; --surface-2: #1d2225; --line: #343b3f; --line-2: #444c50;
    --ink: #ece7df; --ink-2: #c3c6c4; --ink-3: #9da3a3;
    --primary: #7fbab2; --primary-ink: #10201e; --primary-soft: #263936; --primary-text: #9fd1c9;
    --accent: #f0b894; --accent-soft: #3d2e25; --butter: #e9cf7d; --butter-soft: #39331f;
    --warn-ink: #f1d48c; --warn-soft: #3a321d; --over-ink: #f3a991; --over-soft: #3f2721; --ok-ink: #9fd1c9; --ok-soft: #263936;
    --focus: #f0b894; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181c1e; --surface: #22282b; --surface-2: #1d2225; --line: #343b3f; --line-2: #444c50;
  --ink: #ece7df; --ink-2: #c3c6c4; --ink-3: #9da3a3;
  --primary: #7fbab2; --primary-ink: #10201e; --primary-soft: #263936; --primary-text: #9fd1c9;
  --accent: #f0b894; --accent-soft: #3d2e25; --butter: #e9cf7d; --butter-soft: #39331f;
  --warn-ink: #f1d48c; --warn-soft: #3a321d; --over-ink: #f3a991; --over-soft: #3f2721; --ok-ink: #9fd1c9; --ok-soft: #263936;
  --focus: #f0b894; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px; line-height: 1.45; min-height: 100vh; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; margin: 0; line-height: 1.15; letter-spacing: -.005em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 1.25em; height: 1.25em; flex: 0 0 auto; vertical-align: -0.25em; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- frame */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 110px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0 10px; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--primary-text);
  box-shadow: var(--shadow); flex: 0 0 auto; position: relative; }
.mark .ico { width: 22px; height: 22px; }
.mark i { position: absolute; right: 4px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.logo h1 { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.chip-btn { display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--surface); color: var(--ink); border-radius: 99px;
  padding: 9px 14px; font-weight: 800; font-size: 14px; box-shadow: var(--shadow); min-height: 42px; }
.chip-btn[aria-pressed="true"] { background: var(--butter); color: #2F3437; }
.icon-btn { width: 44px; height: 44px; padding: 0; justify-content: center; flex: 0 0 auto; }
.show-phone { display: none; }
.lbl-short { display: none; }
@supports (-webkit-touch-callout: none) {
  /* iOS Safari draws date inputs with its own minimum width and centred text, so they spill out of the card */
  input[type="date"].input { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; }
  input[type="date"].input::-webkit-date-and-time-value { text-align: left; margin: 0; }
}
.saved-state { font-size: 12.5px; color: var(--ink-3); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }

.banner { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; border-radius: 14px; padding: 11px 14px; margin: 4px 0 12px;
  font-weight: 700; font-size: 14.5px; background: var(--butter-soft); color: var(--ink); border: 1.5px solid var(--butter); }
.banner .ico { color: var(--warn-ink); margin-top: 2px; }
.banner.demo { background: var(--accent-soft); border-color: var(--accent); }
.banner.demo strong { letter-spacing: .04em; }
.banner .grow { flex: 1 1 260px; }
.banner button { margin-left: auto; }

.tabs { display: flex; gap: 8px; padding: 2px 2px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--surface); color: var(--ink-2); border-radius: 99px;
  padding: 10px 16px; font-weight: 800; font-size: 15px; box-shadow: var(--shadow); min-height: 44px; }
.tab[aria-current="page"] { background: var(--primary); color: var(--primary-ink); }

/* ---------- layout */
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.panel h2 { font-size: 22px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head h2 { font-size: 20px; }
.lead { color: var(--ink-2); margin: 4px 0 14px; }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.link-btn { border: 0; background: none; color: var(--primary-text); font-weight: 800; padding: 6px 2px; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- hero */
.hero { padding: 24px 24px 20px; position: relative; overflow: hidden; }
.hero-label { font-weight: 800; font-size: 15px; letter-spacing: .02em; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.hero-amount { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 64px; line-height: 1.02; letter-spacing: -.02em; margin: 8px 0 6px;
  overflow-wrap: anywhere; }
.hero-amount.l1 { font-size: 52px; } .hero-amount.l2 { font-size: 40px; } .hero-amount.l3 { font-size: 30px; }
.hero-amount.over { color: var(--over-ink); }
.hero-amount { white-space: nowrap; overflow: hidden; }
.status { display: inline-flex; align-items: center; gap: 7px; border-radius: 99px; padding: 6px 12px; font-weight: 800; font-size: 14px; }
.status.good { background: var(--ok-soft); color: var(--ok-ink); }
.status.zero { background: var(--warn-soft); color: var(--warn-ink); }
.status.over { background: var(--over-soft); color: var(--over-ink); }
.hero-sub { font-size: 17px; font-weight: 700; margin-top: 10px; color: var(--ink); }
.hero-sub2 { color: var(--ink-2); margin-top: 2px; }
.hero-kind { margin-top: 10px; color: var(--ink-2); }
.hero-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 18px; }
.math { margin-top: 14px; border-top: 1.5px dashed var(--line-2); padding-top: 12px; }
.math-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
.math-row.total { border-top: 1.5px solid var(--line-2); margin-top: 4px; padding-top: 9px; font-weight: 900; }
.math-row .op { width: 1.2em; display: inline-block; color: var(--ink-3); font-weight: 900; }
.math-note { font-size: 13.5px; color: var(--ink-3); margin-top: 6px; }

/* ---------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 14px; padding: 12px 18px; min-height: 48px;
  font-weight: 800; font-size: 16px; background: var(--primary-soft); color: var(--primary-text); text-align: center; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.big { min-height: 60px; font-size: 18px; border-radius: 16px; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--line-2); color: var(--ink); }
.btn.danger { background: var(--over-soft); color: var(--over-ink); }
.btn.sm { min-height: 44px; padding: 8px 14px; font-size: 14.5px; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- lists */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1.5px solid var(--line); min-width: 0; }
.item:first-child { border-top: 0; }
.item .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--primary-text); flex: 0 0 auto; border: 1.5px solid var(--line); }
.item .ic .ico { width: 22px; height: 22px; }
.item .main { flex: 1; min-width: 0; display: block; }
#view:focus { outline: none; }
.item .name { display: block; font-weight: 800; overflow-wrap: anywhere; }
.item .meta { font-size: 13.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.item .amt { font-weight: 900; white-space: nowrap; text-align: right; }
.amt-inline { display: none; font-weight: 900; color: var(--ink); }
.item.is-paid .name, .item.is-paid .amt, .item.is-skipped .name, .item.is-skipped .amt { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.item .acts { display: flex; gap: 6px; align-items: center; }
.item-btn { border: 0; background: none; padding: 0; min-height: 44px; text-align: left; display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; color: inherit; }
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 9px; font-size: 12.5px; font-weight: 800; }
.tag .ico { width: 15px; height: 15px; }
.tag.over { background: var(--over-soft); color: var(--over-ink); }
.tag.today { background: var(--warn-soft); color: var(--warn-ink); }
.tag.ok { background: var(--ok-soft); color: var(--ok-ink); }
.tag.plain { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pay-btn { min-width: 112px; background: transparent; box-shadow: inset 0 0 0 2px var(--primary); color: var(--primary-text); }
.pay-btn[aria-pressed="false"] .ico { opacity: .8; }
.pay-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); box-shadow: none; }
.section-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
  margin: 18px 0 4px; display: flex; align-items: center; gap: 8px; }
.section-title:first-child { margin-top: 0; }
.empty { color: var(--ink-2); padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1.5px dashed var(--line-2); }

/* ---------- notes */
.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 16px; padding: 14px 16px; background: var(--surface); box-shadow: var(--shadow);
  border-left: 6px solid var(--accent); }
.note .ico { width: 24px; height: 24px; color: var(--primary-text); margin-top: 1px; }
.note .body { flex: 1; min-width: 0; }
.note .body p { margin: 0 0 8px; }
.note.pay { border-left-color: var(--primary); }

/* ---------- bars */
.bar { height: 14px; border-radius: 99px; background: var(--surface-2); border: 1.5px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; min-width: 4px; }
.bar.done > i { background: var(--accent); }
.cat-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; }
.cat-row .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--primary-text); }
.cat-row .ic .ico { width: 20px; height: 20px; }
.cat-row .nm { font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.cat-row .bar { height: 10px; margin-top: 5px; }
.goal { padding: 14px 0; border-top: 1.5px solid var(--line); }
.goal:first-child { border-top: 0; padding-top: 0; }
.goal-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.goal-top h3 { font-size: 19px; overflow-wrap: anywhere; }
.goal .bar { margin: 10px 0 8px; height: 18px; }

/* ---------- forms */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 800; font-size: 15px; }
.field .hint { font-size: 13.5px; color: var(--ink-2); }
.field .err { font-size: 14px; color: var(--over-ink); font-weight: 800; display: flex; gap: 6px; align-items: center; }
.input, select.input { width: 100%; border: 2px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 11px 13px; min-height: 48px; font-size: 16px; }
.input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.input.big { font-family: 'Fraunces', Georgia, serif; font-size: 34px; font-weight: 700; padding: 10px 14px; min-height: 66px; }
.input[aria-invalid="true"] { border-color: var(--over-ink); }
.money-wrap { position: relative; display: flex; align-items: center; }
.money-wrap .sym { position: absolute; left: 14px; font-weight: 800; color: var(--ink-3); pointer-events: none; }
.money-wrap .sym.after { left: auto; right: 14px; }
.money-wrap .input { padding-left: 34px; }
.money-wrap.sym-after .input { padding-left: 13px; padding-right: 40px; }
.money-wrap.big-wrap .sym { font-size: 28px; font-family: 'Fraunces', Georgia, serif; }
.money-wrap.big-wrap .input { padding-left: 44px; }
.money-wrap.big-wrap.sym-after .input { padding-left: 14px; padding-right: 54px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.choice button { border: 2px solid var(--line-2); background: var(--surface); border-radius: 14px; padding: 14px; font-weight: 800; text-align: left; min-height: 56px;
  display: flex; align-items: center; gap: 10px; }
.choice button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-text); }
.choice button .ico { width: 24px; height: 24px; }
.toggle { display: flex; align-items: center; gap: 12px; font-weight: 800; padding: 6px 0; }
.toggle input { width: 24px; height: 24px; accent-color: var(--primary); flex: 0 0 auto; }
.seg { display: inline-flex; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 99px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 8px 16px; font-weight: 800; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
.chips button { border: 2px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 800; min-height: 44px; display: inline-flex; gap: 6px; align-items: center; }
.chips button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-text); }

/* ---------- quick add */
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cat-btn { border: 2px solid var(--line-2); background: var(--surface); border-radius: 16px; padding: 12px 6px; min-height: 84px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 14.5px; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
.cat-btn .ico { width: 30px; height: 30px; color: var(--primary-text); }
.cat-btn:active { transform: scale(.97); background: var(--primary-soft); }

/* ---------- calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.cal-head h3 { font-size: 20px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal .dn { text-align: center; font-size: 12.5px; font-weight: 900; color: var(--ink-3); padding: 4px 0; }
.day { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 74px; padding: 6px 5px; text-align: left; display: flex; flex-direction: column;
  gap: 3px; font-size: 12px; overflow: hidden; color: var(--ink); }
.day.out { opacity: .45; }
.day.today { box-shadow: inset 0 0 0 2.5px var(--accent); }
.day[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); }
.day .d { font-weight: 900; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; gap: 2px; }
.day .d .ico { width: 15px; height: 15px; color: var(--primary-text); }
.day .pill { display: block; border-radius: 6px; padding: 1px 4px; background: var(--accent-soft); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .pill.paid { background: var(--surface-2); color: var(--ink-3); text-decoration: line-through; }
.day .pill.pay { background: var(--ok-soft); color: var(--ok-ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); font-weight: 700; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* ---------- modal + toast */
.modal { position: fixed; inset: 0; background: rgba(20,24,26,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px 18px 24px; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.sheet-head h2 { font-size: 23px; }
.sheet .panel { padding: 16px; }
/* Save/Cancel stay in view at the bottom of a tall sheet, also with the phone keyboard open */
.sheet-foot { display: flex; gap: 10px; margin: 16px 0 -24px; flex-wrap: wrap; position: sticky; bottom: -24px; z-index: 2;
  background: var(--bg); padding: 12px 0 24px; box-shadow: 0 -10px 12px -10px rgba(0,0,0,.18); }
.sheet-foot .btn { flex: 1 1 140px; }
.sheet-extra { margin-top: 16px; } .sheet-extra .btn { width: 100%; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #2F3437; color: #fff; border-radius: 14px; padding: 12px 14px 12px 18px;
  display: flex; gap: 14px; align-items: center; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.25); width: max-content; max-width: calc(100vw - 32px); font-weight: 700; }
.toast button { border: 0; background: #F2D98B; color: #2F3437; border-radius: 10px; padding: 8px 14px; min-height: 44px; min-width: 64px; font-weight: 900; }
textarea.input { min-height: 140px; font-family: ui-monospace, monospace; font-size: 12.5px; }

/* ---------- onboarding */
.onb { max-width: 640px; margin: 10px auto 0; }
.onb .panel { padding: 26px; }
.onb h2 { font-size: 30px; margin-bottom: 6px; }
.onb .stepno { font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.onb .progress { height: 8px; border-radius: 99px; background: var(--line); margin-bottom: 18px; overflow: hidden; }
.onb .progress i { display: block; height: 100%; background: var(--primary); }
.onb-bill { background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.onb-bill .three { display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 8px; align-items: end; }
.onb-bill .field { margin-bottom: 0; }
.welcome-art { display: flex; gap: 10px; align-items: center; margin: 4px 0 18px; }

/* ---------- low-energy */
body.low .tabs, body.low .hide-low { display: none !important; }
body.low .wrap { max-width: 620px; }
.low-wrap { display: flex; flex-direction: column; gap: 16px; }
.low-wrap .hero-amount { font-size: 76px; }
.low-wrap .hero-amount.l1 { font-size: 58px; } .low-wrap .hero-amount.l2 { font-size: 44px; } .low-wrap .hero-amount.l3 { font-size: 32px; }

/* ---------- debt */
.disclaimer { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 14.5px; }
.disclaimer .ico { color: var(--warn-ink); margin-top: 2px; }
.result-big { font-family: 'Fraunces', Georgia, serif; font-size: 30px; font-weight: 700; line-height: 1.15; margin: 4px 0; }
.order { counter-reset: o; list-style: none; padding: 0; margin: 8px 0 0; }
.order li { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-top: 1.5px solid var(--line); }
.order li:first-child { border-top: 0; }
.order li b.n { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-text); display: grid; place-items: center; flex: 0 0 auto; }

footer.foot { text-align: center; color: var(--ink-3); font-size: 13px; font-weight: 700; margin-top: 26px; display: flex; flex-direction: column; gap: 3px; }

/* ---------- phone */
@media (max-width: 760px) {
  .wrap { padding: 0 14px 104px; }
  .grid { grid-template-columns: 1fr; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); box-shadow: 0 -4px 20px rgba(0,0,0,.08); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    gap: 0; justify-content: space-around; overflow: visible; }
  .tab { flex: 1 1 0; flex-direction: column; gap: 2px; box-shadow: none; background: none; border-radius: 12px; padding: 6px 2px; font-size: 12px; min-height: 56px; min-width: 0; }
  .tab .ico { width: 24px; height: 24px; }
  .tab[aria-current="page"] { background: var(--primary-soft); color: var(--primary-text); }
  .hero { padding: 20px 18px 18px; }
  .hero-amount { font-size: 56px; } .hero-amount.l1 { font-size: 44px; } .hero-amount.l2 { font-size: 34px; } .hero-amount.l3 { font-size: 26px; }
  .low-wrap .hero-amount { font-size: 64px; }
  .panel { padding: 16px; }
  .logo, .logo > div { min-width: 0; }
  .logo h1 { font-size: 17px; white-space: normal; line-height: 1.1; }
  .logo small { display: none; }
  .chip-btn .lbl-long { display: none; }
  .top-actions .chip-btn { flex-direction: column; gap: 2px; width: auto; height: auto; min-height: 48px; padding: 5px 9px; border-radius: 14px; }
  .top-actions .chip-btn .lbl-short { display: block; font-size: 10.5px; line-height: 1.1; white-space: nowrap; }
  .show-phone { display: inline-flex; }
  .saved-state { display: none; }
  .hero-actions { grid-template-columns: 1fr; }
  .item .amt { display: none; }
  .amt-inline { display: block; width: 100%; }
  .pay-btn { min-width: 0; }
  .banner { padding: 9px 12px; font-size: 14px; }
  .day { min-height: 54px; padding: 4px 3px; font-size: 10.5px; border-radius: 9px; }
  .day .pill { padding: 0 2px; }
  .day .pill .amt-txt { display: none; }
  .onb-bill .three { grid-template-columns: 1fr 1fr; }
  .onb-bill .three .field:first-child { grid-column: 1 / -1; }
  .toast { bottom: 84px; }
  .onb .panel { padding: 20px; }
  .onb h2 { font-size: 26px; }
}
@media (max-width: 359px) {
  .two, .onb-bill .three { grid-template-columns: 1fr; }
  .onb-bill .three .field:first-child { grid-column: auto; }
}
@media (min-width: 761px) {
  .modal { align-items: center; padding: 20px; }
  .sheet { border-radius: 24px; }
  .tab.t-settings { margin-left: auto; }
  .lbl-short-h { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media print {
  .tabs, .top-actions, .modal, .toast, .hero-actions, .acts { display: none !important; }
  body { background: #fff; }
}

.paycard { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 16px; padding: 14px; margin-top: 12px; }
.csv-block { border-top: 1.5px dashed var(--line-2); margin-top: 14px; padding-top: 14px; }
.chips button svg.ico { width: 16px; height: 16px; opacity: .7; }

/* ---------- subscriptions */
.lbl-short-h { display: none; }
.hide-phone { }
.welcome { max-width: 680px; }
.welcome h2 { font-size: 30px; margin-bottom: 6px; }
.welcome-art { display: flex; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
.welcome-art .ic, .trial-row .ic, .rev .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--primary-text); flex: 0 0 auto; }
.welcome-art .ic .ico, .trial-row .ic .ico, .rev .ic .ico { width: 22px; height: 22px; }
.field.narrow { max-width: 280px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.stat { background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-l { font-weight: 800; font-size: 13.5px; color: var(--ink-2); }
.stat-v { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.1; overflow-wrap: anywhere; }
.stat-s { font-size: 14px; color: var(--ink-2); font-weight: 700; }
.cancel-y { display: flex; gap: 5px; align-items: center; color: var(--over-ink); margin-top: 4px; }
.hero-actions { grid-template-columns: 1fr; }

.item.is-ended .name, .item.is-ended .amt { color: var(--ink-3); }

.trials { border: 2px solid var(--primary-soft); }

.sort-row { margin: -4px 0 8px; }

.count { font-weight: 800; margin: 4px 0 12px; }
.tips { margin: 4px 0 0; padding-left: 20px; }

.sep { border: 0; border-top: 1.5px dashed var(--line-2); margin: 6px 0; width: 100%; }

.toggle .ico { color: var(--primary-text); }
textarea.note-in { min-height: 70px; font-family: inherit; font-size: 16px; }
textarea.mono { font-family: ui-monospace, monospace; font-size: 12.5px; }
.price-log { border-top: 1.5px dashed var(--line-2); margin-top: 6px; padding-top: 6px; }
.plist { list-style: none; padding: 0; margin: 4px 0 8px; }
.plist li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-weight: 700; }
.plist li:first-child { border-top: 0; }
.qp { margin-top: 4px; }
.qp button { font-size: 14px; padding: 6px 12px; }
.qp button .ico { width: 16px; height: 16px; }
.promo .btn { width: 100%; }
.sheet .toggle { margin-bottom: 10px; }
@media (max-width: 760px) {
  .hide-phone { display: none !important; }

  .item .amt-col { display: none; }
  .stat-v { font-size: 22px; }
  .trial-row .acts, .rev .acts { margin-left: 52px; }
  .qp { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -2px; padding: 2px; }
  .qp::-webkit-scrollbar { display: none; }
  .qp button { flex: 0 0 auto; white-space: nowrap; }
}
@media (max-width: 359px) {
  .stats, .seg-radio { grid-template-columns: 1fr; }
  .trial-row .acts, .rev .acts { margin-left: 0; }
}

  function load() {
    if (DEMO) { S = sampleState(); return; }
    let raw = null;
    try {
      localStorage.setItem("doneenough.test", "1"); localStorage.removeItem("doneenough.test");
      raw = localStorage.getItem(KEY);
    } catch (e) { STORAGE_OK = false; }
    if (raw) { try { const r = C.sanitizeState(JSON.parse(raw), today()); if (r.ok) S = r.state; } catch (e) { S = null; } }
    if (!S) S = freshState();
  }
  function persist() {
    if (DEMO) return;
    try { localStorage.setItem(KEY, JSON.stringify(S)); STORAGE_OK = true; } catch (e) { STORAGE_OK = false; }
  }
  function changed() { S.settings.changedAt = Date.now(); }

  function commit(keepModal) {
    persist();
    let k = null;
    if (!keepModal && MODAL) { k = MODAL.opener; closeModal(true); }
    render();
    if (k) { const el = document.querySelector(k); if (el) el.focus({ preventScroll: true }); }
  }

  // ------------------------------------------------------------------ render shell
  let R = null;
  function applyTheme() {
    const th = S.settings.theme;
    const root = document.documentElement;
    if (th === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", th);
    const pal = S.settings.palette;
    if (pal && pal !== "default") {
      const dark = th === "dark" || (th === "auto" && !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches));
      root.setAttribute("data-palette", pal);
      if (dark) root.setAttribute("data-dark", ""); else root.removeAttribute("data-dark");
    } else { root.removeAttribute("data-palette"); root.removeAttribute("data-dark"); }
    root.lang = T.lang;
  }
  let RENDERING = false;
  function render() {
    if (RENDERING) return;
    RENDERING = true;
    try { renderNow(); } finally { RENDERING = false; }
  }
  function renderNow() {
    applyTheme();
    const active = document.activeElement, key = active && active.getAttribute ? focusKey(active) : null;
    R = C.compute(S, today());
    const view = ({ home: homeView, all: allView, remind: remindView, settings: settingsView }[UI.tab] || homeView)();
    $("app").innerHTML = `<div class="wrap">${topBar()}${banners()}${navBar()}<main id="view" tabindex="-1">${view}</main>${footer()}</div>`;
    if (key) { const el = document.querySelector(key); if (el) el.focus({ preventScroll: true }); }
    fitAmounts();
  }
  function fitAmounts() {
    document.querySelectorAll(".hero-amount").forEach((el) => {
      el.style.fontSize = "";
      let fs = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth + 1 && fs > 18) { fs -= 2; el.style.fontSize = fs + "px"; }
    });
  }
  function focusKey(el) {
    if (el.id && el.id !== "view") return "#" + CSS.escape(el.id);
    const a = el.getAttribute("data-act");
    if (!a) return null;
    let k = `[data-act="${CSS.escape(a)}"]`;
    ["data-id", "data-tab", "data-v"].forEach((n) => { const v = el.getAttribute(n); if (v != null) k += `[${n}="${CSS.escape(v)}"]`; });
    return k;
  }
  function topBar() {
    const saved = DEMO ? te("demoNotSaved") : STORAGE_OK ? te("savedHere") : "";
    return `<header class="top"><div class="logo"><span class="mark">${icon("check")}<i></i></span><div><h1><span class="lbl-long">${te("appName")}</span><span class="lbl-short-h">${te("appShort")}</span></h1><small>${te("tagline")}</small></div></div>
      <div class="top-actions"><span class="saved-state" aria-live="polite">${saved ? icon(DEMO ? "alert" : "lock") + saved : ""}</span>${S.items.length ? `<button class="btn sm primary hide-phone" data-act="add">${icon("plus")}${te("addService")}</button>` : ""}</div></header>`;
  }

  function footer() { return `<footer class="foot"><span>${te("aboutAdvice")}</span><span>Done Enough Co. · Done is enough.</span></footer>`; }

  // ------------------------------------------------------------------ rows
  function tags(it, opts) {
    opts = opts || {};
    const out = [], tr = C.trialInfo(it, today());
    if (opts.afterTrial) out.push(`<span class="tag trial">${icon("hourglass")}${te("tagAfterTrial")}</span>`);
    else if (tr && tr.active) out.push(`<span class="tag trial">${icon("hourglass")}${te("tagTrial")}</span>`);
    if (it.status === "cancel") out.push(`<span class="tag over">${icon("off")}${te("tagCancel")}</span>`);
    if (it.status === "review") out.push(`<span class="tag today">${icon("alert")}${te("tagReview")}</span>`);
    if (it.unused && !opts.noUnused) out.push(`<span class="tag plain">${te("tagUnused")}</span>`);
    return out.join("");
  }
  function row(it, o) {
    o = o || {};
    const date = o.date != null ? o.date : C.nextDue(it, today());
    const when = it.ended ? `<span>${te("tagEnded", { date: dateLabel(C.parse(it.ended), { noDow: true }) })}</span>`
      : date != null ? `<span>${esc(dateLabel(date))} · ${esc(rel(date))}</span>` : "";
    const sub = o.yearly ? `<span class="sub-amt">${te("costYear", { amount: money(C.yearlyCost(it)) })}</span>` : `<span class="sub-amt">${esc(howOften(it))}</span>`;
    const acts = o.acts || "";
    return `<div class="item ${it.ended ? "is-ended" : ""}" data-row="${esc(it.id)}">
      <button class="item-btn" data-act="edit" data-id="${esc(it.id)}"><span class="ic">${icon(CAT_ICON[it.cat] || "dots")}</span>
      <span class="main"><span class="name">${esc(it.name)}</span><span class="meta">${tags(it, o)}${when}${it.paidBy ? `<span class="paid">${icon("card")}${esc(it.paidBy)}</span>` : ""}</span>
      <span class="amt-inline num">${esc(money(it.amount))} · ${esc(o.yearly ? t("costYear", { amount: money(C.yearlyCost(it)) }) : howOften(it))}</span></span></button>

  function trialsPanel() {
    if (!R.trials.length) return "";

      const it = x.item, tr = x.trial, near = tr.toCancel <= 2;
      const cb = tr.passed ? `<span class="tag over">${icon("alert")}${te("trialPassed")}</span><span>${te("trialEnds", { date: dateLabel(tr.end) })} · ${esc(rel(tr.end))}</span>`
        : `<span class="tag ${near ? "today" : "trial"}">${icon("hourglass")}${te("trialCancelBy", { date: dateLabel(tr.cancelBy) })}</span><span>${esc(rel(tr.cancelBy))}</span>`;

        <span class="main"><span class="name">${esc(it.name)}</span><span class="meta">${cb}</span><span class="meta">${te("trialThen", { amount: money(it.amount), often: howOften(it).toLowerCase() })}${tr.passed ? "" : " · " + te("trialEnds", { date: dateLabel(tr.end, { noDow: true }) })}</span></span></button>
        <span class="acts">${it.status !== "keep" ? `<button class="btn sm" data-act="keep" data-id="${esc(it.id)}">${icon("check")}${te("keepIt")}</button>` : ""}<button class="btn sm ghost" data-act="ended" data-id="${esc(it.id)}">${te("cancelledIt")}</button></span></div>`;
    }).join("");
    return `<section class="panel trials" aria-labelledby="tr-title"><div class="panel-head"><h2 id="tr-title">${icon("hourglass")}${te("trialsTitle")}</h2><span class="small muted">${te("trialsLead")}</span></div>${rows}</section>`;

  function upcomingPanel() {
    const list = R.upcoming.length ? R.upcoming.map((u) => row(u.item, { date: u.date, afterTrial: u.afterTrial, noUnused: true })).join("") : `<p class="empty">${te("next30None")}</p>`;
    return `<section class="panel" aria-labelledby="up-title"><div class="panel-head"><h2 id="up-title">${te("listTitle")}</h2><span class="small muted">${te("next30")}</span></div><div class="list" data-testid="upcoming">${list}</div></section>`;
  }
  function reasonText(x) {
    if (x.k === "review") return te("rReview");
    if (x.k === "cancel") return te("rCancel", { date: x.next != null ? dateLabel(x.next, { noDow: true }) : "?" });
    if (x.k === "rise") return te("rRise", { from: money(x.from), to: money(x.to), date: dateLabel(x.date, { noDow: true }) });
    if (x.k === "unused") return te("rUnused");

    const body = R.review.length ? R.review.map((r) => {

        <ul class="reasons">${r.reasons.map((x) => `<li class="r-${x.k}">${icon(x.k === "rise" ? "up" : x.k === "cancel" ? "off" : x.k === "unused" ? "heart" : x.k === "trialEnded" ? "hourglass" : "alert")}${reasonText(x)}</li>`).join("")}</ul>
        <span class="meta">${te("costYear", { amount: money(r.yearly) })}</span></span></button>
        <span class="acts"><button class="btn sm" data-act="keep" data-id="${esc(it.id)}">${icon("check")}${te("keepIt")}</button><button class="btn sm ghost" data-act="ended" data-id="${esc(it.id)}">${te("cancelledIt")}</button></span></div>`;

  function allView() {
    const d = today(), act = S.items.filter((x) => !x.ended);

      if (UI.filter === "all") return true;
      if (UI.filter === "trial") { const tr = C.trialInfo(x, d); return !!(tr && tr.active); }
      return x.status === UI.filter;
    });
    const nd = (x) => { const n = C.nextDue(x, d); return n == null ? 1e9 : n; };
    const isTrial = (x) => { const tr = C.trialInfo(x, d); return tr && tr.active ? 0 : 1; };
    if (UI.sort === "cost") list.sort((a, b) => C.yearlyCost(b) - C.yearlyCost(a));
    else if (UI.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
    else list.sort((a, b) => isTrial(a) - isTrial(b) || nd(a) - nd(b));

    return `<div class="grid"><div class="col"><section class="panel" aria-labelledby="rm-title"><h2 id="rm-title">${icon("bell")}${te("remindTitle")}</h2><p class="lead">${te("remindLead")}</p>

  function icsFile() {

  function shareOk() {
    try { return !!(navigator.canShare && window.File && navigator.canShare({ files: [new File(["x"], "x.ics", { type: "text/calendar" })] })); } catch (e) { return false; }

  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

    const f = icsFile();

  function setPath(path, value) {
    const [a, b] = path.split(".");
    let v = value;
    if (b === "lead" || b === "months" || b === "decimals") v = +value;
    if (b === "symbol") v = String(value).slice(0, 5);
    if (S[a][b] === v) return;
    const snap = snapshot();
    S[a][b] = v;
    if (path === "settings.currency" && C.CURRENCIES[v]) { S.settings.numberFormat = C.CURRENCIES[v].nf; S.settings.symbolPos = "auto"; }
    commit(true);
    toast(t("settingChanged"), () => restoreSnap(snap));
  }

  // ------------------------------------------------------------------ modal
  let MODAL = null;
  function openModal(title, body, opts) {
    opts = opts || {};
    const opener = document.activeElement;
    MODAL = { submit: opts.submit, opener: opener && opener.getAttribute ? focusKey(opener) : null };
    const m = $("modal");
    m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title"><form id="m-form" novalidate><div class="sheet-head"><h2 id="m-title">${esc(title)}</h2>
      <button type="button" class="chip-btn icon-btn" data-act="close" aria-label="${te("close")}">${icon("x")}</button></div>${body}</form></div>`;
    m.hidden = false;
    document.body.style.overflow = "hidden";
    const f = m.querySelector("[autofocus]") || m.querySelector("input:not([type=hidden]),select,textarea,button");
    if (f) setTimeout(() => f.focus(), 30);
  }
  function closeModal(noFocus) {
    const m = $("modal");
    if (m.hidden) return;
    m.hidden = true; m.innerHTML = ""; document.body.style.overflow = "";
    const k = MODAL && MODAL.opener;
    MODAL = null;
    if (!noFocus && k) { const el = document.querySelector(k); if (el) el.focus(); }
  }
  function fieldErr(id, k) {
    const el = $(id);
    if (!el) return;
    el.setAttribute("aria-invalid", "true");
    const f = el.closest(".field");
    if (f && !f.querySelector(".err")) f.insertAdjacentHTML("beforeend", `<span class="err" role="alert">${icon("alert")}${te(k)}</span>`);
    el.focus();
  }
  const val = (id) => { const el = $(id); return el ? el.value : ""; };
  const foot = () => `<div class="sheet-foot"><button type="button" class="btn ghost" data-act="close">${te("cancel")}</button><button type="submit" class="btn primary">${te("save")}</button></div>`;
  function confirmBox(text, yesLabel, onYes, danger) {
    openModal(t("yes") + "?", `<p>${esc(text)}</p><div class="sheet-foot"><button type="button" class="btn ghost" data-act="close">${te("cancel")}</button>
      <button type="submit" class="btn ${danger ? "danger" : "primary"}">${esc(yesLabel)}</button></div>`, { submit: () => { onYes(); return true; } });
  }
  function moneyInput(id, cents, o) {
    o = o || {};
    const si = symInfo(), v = cents == null || cents === "" ? "" : moneyPlain(cents);
    return `<div class="money-wrap ${si.after ? "sym-after" : ""}"><span class="sym ${si.after ? "after" : ""}" aria-hidden="true">${esc(si.sym)}</span>
      <input class="input num" id="${id}" inputmode="decimal" autocomplete="off" value="${esc(v)}" placeholder="0" ${o.desc ? `aria-describedby="${o.desc}"` : ""}></div>`;
  }

  /* add / edit one service */
  function serviceDialog(id) {
    const d = today(), it = id ? S.items.find((x) => x.id === id) : null;
    if (id && !it) return;
    if (!it && S.items.length >= C.MAX_ITEMS) { toast(t("tooMany", { n: C.MAX_ITEMS })); return; }
    const tr = it && it.trial ? it.trial : null;
    const preset = it ? C.presetOf(it) : "m1";
    const next = it ? (C.nextDue(it, d) != null ? C.fmt(C.nextDue(it, d)) : it.anchor) : "";
    const lead = S.settings.lead;
    const paidList = [...new Set(S.items.map((x) => (x.paidBy || "").trim()).filter(Boolean))];
    const quick = it ? "" : `<p class="lbl small" id="qp-l">${te("quickPick")}</p><div class="chips qp" role="group" aria-labelledby="qp-l">${T.qp.map((n, i) => `<button type="button" data-act="qp" data-v="${i}">${icon(CAT_ICON[T.qpCat[i]])}${esc(n)}</button>`).join("")}</div>`;
    const prices = it ? `<div class="price-log"><h3 class="section-title">${icon("up")}${te("priceLog")}</h3>${(it.prices || []).length ? `<ul class="plist">${it.prices.slice().reverse().map((p) =>
      `<li><span>${esc(dateLabel(C.parse(p.date), { noDow: true }))}</span><span class="num">${esc(money(p.from))} → ${esc(money(p.to))}</span></li>`).join("")}</ul>` : `<p class="small muted">${te("priceLogNone")}</p>`}
      <details id="pl-box"><summary>${te("priceLogNew")}</summary><div class="two"><div class="field"><label for="pl-amt">${te("priceNewAmt")}</label>${moneyInput("pl-amt", "")}</div>

      <button type="button" class="btn sm danger" data-act="del" data-id="${esc(it.id)}">${icon("x")}${te("delService")}</button></div>` : "";
    const status = (it ? it.status : "keep");
    const body = `${quick}
      <div class="two"><div class="field"><label for="f-name">${te("fName")}</label><input class="input" id="f-name" maxlength="80" autocomplete="off" placeholder="${te("fNamePh")}" value="${esc(it ? it.name : "")}" ${it ? "" : "autofocus"}></div>
      <div class="field"><label for="f-amt" id="f-amt-l">${te(tr ? "fAmountTrial" : "fAmount")}</label>${moneyInput("f-amt", it ? it.amount : "")}</div></div>
      <div class="two"><div class="field"><label for="f-often">${te("fOften")}</label>${sel("f-often", "", PRESET_KEYS.map((k) => [k, t(k)]), preset)}</div>
      <div class="field" id="f-n-wrap" ${preset === "mN" ? "" : "hidden"}><label for="f-n">${te("monthsN")}</label><input class="input num" id="f-n" inputmode="numeric" value="${it && preset === "mN" ? it.every : 4}"></div>
      <div class="field" id="f-next-wrap" ${tr ? "hidden" : ""}><label for="f-next">${te("fNext")}</label><input type="date" class="input" id="f-next" value="${esc(next)}" data-orig="${esc(next)}"></div></div>
      <label class="toggle"><input type="checkbox" id="f-trial" ${tr ? "checked" : ""}>${icon("hourglass")}${te("fTrial")}</label>
      <div id="f-trial-box" class="trial-box" ${tr ? "" : "hidden"}><div class="two"><div class="field"><label for="f-tend">${te("fTrialEnd")}</label><input type="date" class="input" id="f-tend" value="${esc(tr ? tr.end : "")}"></div>
        <div class="field"><label for="f-tcb">${te("fCancelBy")}</label><input type="date" class="input" id="f-tcb" value="${esc(tr ? tr.cancelBy : "")}" data-auto="${tr ? "" : "1"}" aria-describedby="f-tcb-h"></div></div>
        <p class="hint small" id="f-tcb-h">${te(lead === 1 ? "fCancelByHint" : "fCancelByHint2", { n: lead })} ${te("fTrialNote")}</p></div>
      <div class="two"><div class="field"><label for="f-cat">${te("fCat")}</label>${sel("f-cat", "", C.CATS.map((c) => [c, catName(c)]), it ? it.cat : "other")}</div>
      <div class="field"><label for="f-paid">${te("fPaidBy")}</label><input class="input" id="f-paid" maxlength="60" list="paid-list" autocomplete="off" placeholder="${te("fPaidByPh")}" value="${esc(it ? it.paidBy : "")}" aria-describedby="f-paid-h">

      <label class="toggle"><input type="checkbox" id="f-unused" ${it && it.unused ? "checked" : ""}>${te("fUnused")}</label>
      <div class="field"><label for="f-note">${te("fNote")}</label><textarea class="input note-in" id="f-note" maxlength="300" placeholder="${te("fNotePh")}">${esc(it ? it.note : "")}</textarea></div>
      ${prices}${extra}${foot()}`;
    openModal(it ? t("dlgEdit", { name: it.name }) : t("dlgAdd"), body, { submit: () => saveService(it) });
  }

  function saveService(it) {
    const d = today(), name = val("f-name").trim(), amt = pm(val("f-amt"));
    if (!name) { fieldErr("f-name", "errName"); return false; }
    if (amt == null) { fieldErr("f-amt", "errAmount"); return false; }
    const preset = val("f-often");
    let freq, every;
    if (preset === "mN") {
      const n = Math.floor(+val("f-n"));
      if (!(n >= 1 && n <= 60)) { fieldErr("f-n", "errMonths"); return false; }
      freq = "month"; every = n;
    } else { freq = C.PRESETS[preset][0]; every = C.PRESETS[preset][1]; }
    const trialOn = $("f-trial").checked;
    let trial = null, anchor = null, day = null;
    if (trialOn) {
      const e = val("f-tend"), cb = val("f-tcb") || C.defaultCancelBy(e, S.settings.lead);
      if (isNaN(C.parse(e))) { fieldErr("f-tend", "errDate"); return false; }
      if (isNaN(C.parse(cb))) { fieldErr("f-tcb", "errDate"); return false; }
      if (C.parse(cb) > C.parse(e)) { fieldErr("f-tcb", "errCancelBy"); return false; }
      trial = { end: e, cancelBy: cb };
      anchor = e; day = C.ymd(C.parse(e)).d;
    } else {
      const nx = val("f-next"), orig = $("f-next").getAttribute("data-orig");
      if (isNaN(C.parse(nx))) { fieldErr("f-next", "errDate"); return false; }
      if (!it || nx !== orig || (it.trial && !trialOn)) { anchor = nx; day = C.ymd(C.parse(nx)).d; }
      else if (it.freq !== freq || it.every !== every) { anchor = nx; day = it.day || C.ymd(C.parse(nx)).d; }
    }
    const status = (document.querySelector("input[name=f-status]:checked") || {}).value || "keep";
    const snap = snapshot();
    const fields = { name, freq, every, cat: val("f-cat"), paidBy: val("f-paid").trim().slice(0, 60), status, unused: $("f-unused").checked, note: val("f-note").trim().slice(0, 300), trial };
    if (it) {
      if (amt !== it.amount) C.changePrice(it, amt, C.fmt(d));
      Object.assign(it, fields);
      if (anchor) { it.anchor = anchor; it.day = freq === "month" ? day : 0; }
      if (freq === "week") it.day = 0;
      changed(); commit(); toast(t("saved"), () => restoreSnap(snap));
    } else {
      const n = { id: uid(), amount: amt, anchor, day: freq === "month" ? day : 0, prices: [], ended: "", ack: "", created: C.fmt(d) };
      Object.assign(n, fields);
      const clean = C.sanitizeState({ items: [n] }, d).state.items[0];
      S.items.push(clean);
      changed(); commit(); toast(t("added", { name }), () => restoreSnap(snap));
    }
    return true;
  }

  // ------------------------------------------------------------------ backup
  function backupSave() {
    if (DEMO) { toast(t("demoNoSave")); return; }
    download(`done-enough-subscriptions-backup-${C.fmt(today())}.json`, JSON.stringify(C.makeBackup(S, Date.now()), null, 1), "application/json");
    S.settings.lastBackup = Date.now();
    UI.dismissed.backup = true;
    commit(true);
    toast(t("backupSaved"));
  }
  function restoreFrom(text) {
    let parsed = null;
    try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
    const r = parsed && parsed.app === C.APP_ID ? C.sanitizeState(parsed, today()) : { ok: false };
    if (!r.ok) { closeModal(true); openModal(t("backupRestore"), `<p role="alert">${te("backupBad")}</p><div class="sheet-foot"><button type="button" class="btn primary" data-act="close">${te("close")}</button></div>`); return; }
    const when = parsed.exported ? dateLabel(C.todayLocal(new Date(parsed.exported))) : "?";
    confirmBox(t("backupRestoreConfirm", { date: when }), t("backupRestore"), () => { const snap = snapshot(); S = r.state; UI.tab = "home"; commit(); toast(t("backupRestored"), () => restoreSnap(snap)); });
  }
  function backupCopy() {
    if (DEMO) { toast(t("demoNoSave")); return; }
    const text = JSON.stringify(C.makeBackup(S, Date.now()));
    openModal(t("backupCopy"), `<p class="lead">${te("backupTextHint")}</p><textarea class="input mono" id="bk-text" readonly aria-label="${te("backupCopy")}">${esc(text)}</textarea>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-act="close">${te("close")}</button><button type="button" class="btn primary" data-act="copyText">${icon("copy")}${te("copyBtn")}</button></div>`);
  }
  function copyText() {
    const ta = $("bk-text");
    if (!ta) return;
    const done = () => { S.settings.lastBackup = Date.now(); persist(); toast(t("backupCopied")); };
    ta.select();
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ } });
    else { try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ } }
  }
  function backupPaste() {
    if (DEMO) { toast(t("demoNoSave")); return; }
    openModal(t("backupPaste"), `<p class="lead">${te("backupPasteHint")}</p><textarea class="input mono" id="bk-paste" aria-label="${te("backupPaste")}"></textarea>${foot()}`,
      { submit: () => { restoreFrom(val("bk-paste")); return false; } });
  }

  // ------------------------------------------------------------------ toast
  let toastTimer = null, toastUndo = null;
  function toast(msg, undo) {
    const el = $("toast");
    toastUndo = undo || null;
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">${te("undo")}</button>` : ""}`;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; toastUndo = null; }, undo ? 7000 : 3500);
  }

  // ------------------------------------------------------------------ undo (a copy of the list from before an edit, kept for the toast)
  function snapshot() { return JSON.stringify(S); }
  function restoreSnap(snap) {
    let r = null;
    try { r = C.sanitizeState(JSON.parse(snap), today()); } catch (e) { r = null; }
    if (!r || !r.ok) return;
    S = r.state;
    if (MODAL) closeModal(true);
    commit(true);
    toast(t("undone"));
  }

    if (DEMO) { toast(t("demoNoSave")); return; }

    download(`done-enough-subscriptions-list-${C.fmt(today())}.csv`, "\ufeff" + C.toCsv(rows, [2, 3, 7]), "text/csv;charset=utf-8");
    toast(t("csvSaved"));
  }

  function moveDialog() {
    openModal(t("moveTitle"), `<p class="lead">${te("moveLead")}</p>
      <ol class="steps"><li><span>${te("moveS1")}<span class="btn-row" style="margin-top:8px"><button type="button" class="btn sm primary" data-act="backupSave">${icon("download")}${te("backupSave")}</button><button type="button" class="btn sm ghost" data-act="backupCopy">${icon("copy")}${te("backupCopy")}</button></span></span></li>
      <li><span>${te("moveS2")}</span></li><li><span>${te("moveS3")}</span></li></ol><p class="muted small">${te("moveEnd")}</p>
      <div class="sheet-foot"><button type="button" class="btn primary" data-act="close">${te("close")}</button></div>`);
  }

  // ------------------------------------------------------------------ print my list (several pages, built only while printing)
  function printHtml() {
    const d = today(), r = C.compute(S, d), act = S.items.filter((x) => !x.ended);
    const nd = (x) => { const n = C.nextDue(x, d); return n == null ? 1e9 : n; };
    const list = act.slice().sort((a, b) => nd(a) - nd(b) || a.name.localeCompare(b.name));
    const th = (keys, cls) => `<thead><tr>${keys.map((k, i) => `<th class="${cls && cls[i] || ""}">${te(k)}</th>`).join("")}</tr></thead>`;
    const status = (it) => {
      const tr = C.trialInfo(it, d), out = [];
      if (tr && tr.active) out.push(t("tagTrial"));
      out.push(t("st_" + it.status));
      if (it.unused) out.push(t("tagUnused"));
      return out.join(" · ");
    };
    const trials = r.trials.length ? `<section><h2>${te("printTrials")}</h2><table>${th(["printColService", "printColCancelBy", "printColEnds", "printColThen"], ["", "", "", "r"])}<tbody>${r.trials.map((x) =>
      `<tr><td>${esc(x.item.name)}</td><td>${esc(dateLabel(x.trial.cancelBy))}</td><td>${esc(dateLabel(x.trial.end))}</td><td class="r num">${esc(money(x.item.amount))} · ${esc(howOften(x.item))}</td></tr>`).join("")}</tbody></table></section>` : "";
    const next = `<section><h2>${te("printNext30")}</h2>${r.upcoming.length ? `<table>${th(["printColDate", "printColService", "printColAmount", "printColPaid"], ["", "", "r", ""])}<tbody>${r.upcoming.map((u) =>
      `<tr><td>${esc(dateLabel(u.date))}</td><td>${esc(u.item.name)}</td><td class="r num">${esc(money(u.amount))}</td><td>${esc(u.item.paidBy || "")}</td></tr>`).join("")}</tbody></table>` : `<p>${te("printNoneNext")}</p>`}</section>`;
    const all = `<section><h2>${te("printAll")} (${act.length})</h2><table>${th(["printColService", "printColNext", "printColPrice", "printColOften", "printColYear", "printColCat", "printColPaid", "printColStatus"], ["", "", "r", "", "r", "", "", ""])}<tbody>${list.map((it) => {
      const n = C.nextDue(it, d);
      return `<tr><td>${esc(it.name)}</td><td class="nw">${n == null ? "" : esc(dateLabel(n))}</td><td class="r num">${esc(money(it.amount))}</td><td class="nw">${esc(howOften(it))}</td><td class="r num">${esc(money(Math.round(C.yearlyCost(it))))}</td><td>${esc(catName(it.cat))}</td><td>${esc(it.paidBy || "")}</td><td>${esc(status(it))}</td></tr>`;
    }).join("")}</tbody><tfoot><tr><td colspan="4">${te("printTotalYear")}</td><td class="r num">${esc(money(r.yearly))}</td><td colspan="3">${te("perMonth", { amount: money(r.monthly) })}</td></tr></tfoot></table></section>`;
    const bar = (rows) => `<table class="two-col"><tbody>${rows.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="r num">${esc(money(Math.round(v)))}</td></tr>`).join("")}</tbody></table>`;
    const where = `<section><h2>${te("whereTitle")}</h2><h3>${te("byCat")}</h3>${bar(r.byCat.map((c) => [catName(c.id), c.yearly]))}<h3>${te("byCard")}</h3>${bar(r.byPaidBy.map((c) => [c.name || t("noCard"), c.yearly]))}</section>`;
    const sub = r.next30Count ? t("printNext30Sub", { n: r.next30Count, from: dateLabel(d, { noDow: true }), to: dateLabel(r.windowEnd, { noDow: true }) }) : t("next30None");
    return `<header class="p-head"><h1>${te("appName")} · ${te("printTitle")}</h1><p>${te("printNote", { date: dateLabel(d) })}</p></header>
      <div class="p-totals"><div><span>${te("printNext30")}</span><strong class="num">${esc(money(r.next30))}</strong><small>${esc(sub)}</small></div>
      <div><span>${te("printYear")}</span><strong class="num">${esc(money(r.yearly))}</strong><small>${te("activeCount", { n: r.active })}</small></div>
      <div><span>${te("printMonth")}</span><strong class="num">${esc(money(r.monthly))}</strong></div></div>${trials}${next}${all}${where}`;
  }
  function removePrintDoc() { const el = $("print-doc"); if (el) el.remove(); document.body.classList.remove("printing"); }
  function printList() {
    removePrintDoc();
    const el = document.createElement("div");
    el.id = "print-doc"; el.className = "print-doc";
    el.innerHTML = printHtml();
    document.body.appendChild(el);
    document.body.classList.add("printing");
    try { window.print(); } catch (e) { /* ignore */ }
  }

  // ------------------------------------------------------------------ actions
  const find = (el) => S.items.find((x) => x.id === el.getAttribute("data-id"));
  const ACT = {
    tab: (el) => { UI.tab = el.getAttribute("data-tab"); closeModal(true); render(); const v = $("view"); if (v) v.focus({ preventScroll: true }); window.scrollTo(0, 0); },
    add: () => serviceDialog(null),
    edit: (el) => serviceDialog(el.getAttribute("data-id")),
    how: () => { UI.showHow = !UI.showHow; render(); },
    qp: (el) => {
      const i = +el.getAttribute("data-v"), n = $("f-name"), c = $("f-cat");
      if (n) n.value = T.qp[i];
      if (c) c.value = T.qpCat[i];
      document.querySelectorAll(".qp button").forEach((b) => b.setAttribute("aria-pressed", b === el ? "true" : "false"));
      const a = $("f-amt"); if (a) a.focus();
    },
    keep: (el) => {
      const it = find(el); if (!it) return;
      const before = { status: it.status, unused: it.unused, ack: it.ack };
      it.status = "keep"; it.unused = false; it.ack = C.fmt(today());
      changed(); commit(true);
      toast(t("kept", { name: it.name }), () => { Object.assign(it, before); commit(true); });
    },
    ended: (el) => {
      const it = find(el); if (!it) return;
      it.ended = C.fmt(today());
      changed(); commit();
      toast(t("endedToast", { name: it.name }), () => { it.ended = ""; changed(); commit(true); });
    },
    restore: (el) => { const it = find(el); if (!it) return; const snap = snapshot(); it.ended = ""; changed(); commit(); toast(t("restored", { name: it.name }), () => restoreSnap(snap)); },
    del: (el) => { const it = find(el); if (!it) return; confirmBox(t("delConfirm", { name: it.name }), t("delService"), () => { const snap = snapshot(); S.items = S.items.filter((x) => x !== it); changed(); commit(); toast(t("deleted"), () => restoreSnap(snap)); }, true); },
    priceLog: (el) => {
      const it = find(el); if (!it) return;
      const amt = pm(val("pl-amt")), dt = val("pl-date");
      if (amt == null) { fieldErr("pl-amt", "errAmount"); return; }
      if (isNaN(C.parse(dt))) { fieldErr("pl-date", "errDate"); return; }
      if (C.parse(dt) > today()) { fieldErr("pl-date", "errFuture"); return; }
      const nameNow = val("f-name"), snap = snapshot();
      if (C.parse(dt) >= Math.max(...(it.prices || []).map((p) => C.parse(p.date)), -1e9)) C.changePrice(it, amt, dt);
      else { it.prices.push({ date: dt, from: it.amount, to: amt }); it.prices.sort((a, b) => C.parse(a.date) - C.parse(b.date)); }
      changed(); persist(); render();
      serviceDialog(it.id);
      if (nameNow && $("f-name")) $("f-name").value = nameNow;
      toast(t("priceLogged"), () => restoreSnap(snap));
    },
    filter: (el) => { UI.filter = el.getAttribute("data-v"); render(); },
    sort: (el) => { UI.sort = el.getAttribute("data-v"); render(); },
    icsSave, icsShare, csvSave, moveDevice: moveDialog, printList,
    palette: (el) => { const v = el.getAttribute("data-v"); if (v === S.settings.palette) return; const snap = snapshot(); S.settings.palette = v; commit(true); toast(t("settingChanged"), () => restoreSnap(snap)); },
    close: () => closeModal(),
    undo: () => { const u = toastUndo; $("toast").hidden = true; toastUndo = null; if (u) u(); },
    backupSave, backupCopy, backupPaste, copyText,
    backupRestore: () => { const f = $("restore-file"); if (f) { f.value = ""; f.click(); } },
    dismissBackup: () => { UI.dismissed.backup = true; render(); },
    dismissIcs: () => { UI.dismissed.ics = true; render(); },
    useSample: () => { S = sampleState(); UI.tab = "home"; commit(); },
    loadSample: () => confirmBox(t("dataSampleConfirm"), t("dataSample"), () => { const snap = snapshot(); S = sampleState(); UI.tab = "home"; commit(); toast(t("sampleLoaded"), () => restoreSnap(snap)); }),
    clearSample: () => { const snap = snapshot(); S = freshState(S); UI.tab = "home"; commit(); toast(t("dataCleared"), () => restoreSnap(snap)); },
    clearAll: () => confirmBox(t("dataClearConfirm"), t("dataClear"), () => { const snap = snapshot(); S = freshState(); UI.tab = "home"; if (!DEMO) { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } } commit(); toast(t("dataCleared"), () => restoreSnap(snap)); }, true)
  };

  // ------------------------------------------------------------------ events
  function bind() {
    document.addEventListener("click", (ev) => {
      const el = ev.target.closest("[data-act]");
      if (!el || el.disabled) return;
      const fn = ACT[el.getAttribute("data-act")];
      if (fn) { ev.preventDefault(); fn(el); }
    });
    document.addEventListener("submit", (ev) => {
      if (ev.target.id !== "m-form") return;
      ev.preventDefault();
      if (MODAL && MODAL.submit) { const ok = MODAL.submit(); if (ok === true && !$("modal").hidden && $("m-form") === ev.target) closeModal(); }
    });
    document.addEventListener("input", (ev) => {
      const el = ev.target;
      if (el.getAttribute && el.getAttribute("aria-invalid") === "true") { el.removeAttribute("aria-invalid"); const er = el.closest(".field") && el.closest(".field").querySelector(".err"); if (er) er.remove(); }
      if (el.id === "f-tcb") el.setAttribute("data-auto", "");
    });
    document.addEventListener("change", (ev) => {
      const el = ev.target;
      if (el.id === "restore-file" && el.files && el.files[0]) {
        const fr = new FileReader();
        fr.onload = () => restoreFrom(String(fr.result || ""));
        fr.readAsText(el.files[0]);
        return;
      }
      if (el.id === "f-often") { $("f-n-wrap").hidden = el.value !== "mN"; return; }
      if (el.id === "f-trial") {
        $("f-trial-box").hidden = !el.checked; $("f-next-wrap").hidden = el.checked;
        $("f-amt-l").textContent = t(el.checked ? "fAmountTrial" : "fAmount");
        if (el.checked && !val("f-tend") && val("f-next")) { $("f-tend").value = val("f-next"); $("f-tcb").value = C.defaultCancelBy(val("f-next"), S.settings.lead); }
        if (!el.checked && val("f-tend") && !val("f-next")) $("f-next").value = val("f-tend");
        return;
      }
      if (el.id === "f-tend") { const cb = $("f-tcb"); if (cb && (cb.getAttribute("data-auto") === "1" || !cb.value)) { cb.value = C.defaultCancelBy(el.value, S.settings.lead); cb.setAttribute("data-auto", "1"); } return; }
      if (el.id === "f-tcb") { el.setAttribute("data-auto", ""); return; }
      const set = el.getAttribute && el.getAttribute("data-set");
      if (set) setPath(set, el.type === "checkbox" ? el.checked : el.value);
    });
    document.addEventListener("keydown", (ev) => {
      const m = $("modal");
      if (m.hidden) return;
      if (ev.key === "Escape") { ev.preventDefault(); closeModal(); return; }
      if (ev.key === "Tab") {
        const f = [...m.querySelectorAll("button,input,select,textarea,summary,[tabindex]:not([tabindex='-1'])")].filter((x) => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
        else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
      }
    });
    $("modal").addEventListener("click", (ev) => { if (ev.target === $("modal")) closeModal(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S && $("modal").hidden) render(); });
    window.addEventListener("afterprint", removePrintDoc);
    window.addEventListener("storage", (ev) => { if (!DEMO && ev.key === KEY && ev.newValue && $("modal").hidden) { try { const r = C.sanitizeState(JSON.parse(ev.newValue), today()); if (r.ok) { S = r.state; render(); } } catch (e) { /* ignore */ } } });
    if (window.matchMedia) { const mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", render); }
    window.addEventListener("resize", fitAmounts);
  }

  // test + screenshot hooks (read-only helpers, no network)
  window.SUB_APP = { state: () => S, compute: () => C.compute(S, today()), render, today, ics: () => icsFile() };

  load();
  bind();
  render();
})();
</script>
<script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js');});}</script>
</body>
</html>
