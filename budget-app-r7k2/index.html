<style>/* Done Enough Budget: screen styles. Light + dark via tokens; colour is never the only signal (icons + words too). */
:root {
  --bg: #F3EDE4; --surface: #ffffff; --surface-2: #faf7f2; --line: #e6ddcf; --line-2: #d8cebf;
  --ink: #2F3437; --ink-2: #555c60; --ink-3: #60676b;
  --primary: #3F716C; --primary-ink: #ffffff; --primary-soft: #e3eeec; --primary-text: #2f625d;
  --accent: #E9A87C; --accent-soft: #f9e3d3; --butter: #F2D98B; --butter-soft: #fbf3d8;
  --warn-ink: #7a5310; --warn-soft: #fbf0d3; --over-ink: #9a3f2b; --over-soft: #f8e1d9; --ok-ink: #2f625d; --ok-soft: #e3eeec;
  --focus: #c76a2c; --shadow: 0 1px 2px rgba(47,52,55,.06), 0 6px 22px rgba(47,52,55,.07); --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181c1e; --surface: #22282b; --surface-2: #1d2225; --line: #343b3f; --line-2: #444c50;
    --ink: #ece7df; --ink-2: #c3c6c4; --ink-3: #9da3a3;
    --primary: #7fbab2; --primary-ink: #10201e; --primary-soft: #263936; --primary-text: #9fd1c9;
    --accent: #f0b894; --accent-soft: #3d2e25; --butter: #e9cf7d; --butter-soft: #39331f;
    --warn-ink: #f1d48c; --warn-soft: #3a321d; --over-ink: #f3a991; --over-soft: #3f2721; --ok-ink: #9fd1c9; --ok-soft: #263936;
    --focus: #f0b894; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181c1e; --surface: #22282b; --surface-2: #1d2225; --line: #343b3f; --line-2: #444c50;
  --ink: #ece7df; --ink-2: #c3c6c4; --ink-3: #9da3a3;
  --primary: #7fbab2; --primary-ink: #10201e; --primary-soft: #263936; --primary-text: #9fd1c9;
  --accent: #f0b894; --accent-soft: #3d2e25; --butter: #e9cf7d; --butter-soft: #39331f;
  --warn-ink: #f1d48c; --warn-soft: #3a321d; --over-ink: #f3a991; --over-soft: #3f2721; --ok-ink: #9fd1c9; --ok-soft: #263936;
  --focus: #f0b894; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px; line-height: 1.45; min-height: 100vh; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; margin: 0; line-height: 1.15; letter-spacing: -.005em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 1.25em; height: 1.25em; flex: 0 0 auto; vertical-align: -0.25em; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- frame */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 110px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0 10px; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--primary-text);
  box-shadow: var(--shadow); flex: 0 0 auto; position: relative; }
.mark .ico { width: 22px; height: 22px; }
.mark i { position: absolute; right: 4px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.logo h1 { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.chip-btn { display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--surface); color: var(--ink); border-radius: 99px;
  padding: 9px 14px; font-weight: 800; font-size: 14px; box-shadow: var(--shadow); min-height: 42px; }
.chip-btn[aria-pressed="true"] { background: var(--butter); color: #2F3437; }
.icon-btn { width: 42px; height: 42px; padding: 0; justify-content: center; }
.show-phone { display: none; }
.saved-state { font-size: 12.5px; color: var(--ink-3); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }

.banner { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; border-radius: 14px; padding: 11px 14px; margin: 4px 0 12px;
  font-weight: 700; font-size: 14.5px; background: var(--butter-soft); color: var(--ink); border: 1.5px solid var(--butter); }
.banner .ico { color: var(--warn-ink); margin-top: 2px; }
.banner.demo { background: var(--accent-soft); border-color: var(--accent); }
.banner.demo strong { letter-spacing: .04em; }
.banner .grow { flex: 1 1 260px; }
.banner button { margin-left: auto; }

.tabs { display: flex; gap: 8px; padding: 2px 2px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--surface); color: var(--ink-2); border-radius: 99px;

<script>/* Done Enough Budget: core maths (dates, money, pay schedule, bills, safe to spend, debt plan, backup).
   Pure functions, no DOM. Used by the app (window.DEB_CORE) and by the node tests (require).
   Money is always an integer number of cents. Dates are integers: days since 1970-01-01 (UTC calendar),
   so daylight-saving changes and time zones never shift a due date. */
(function (root) {
  "use strict";

  // ------------------------------------------------------------------ dates
  var MS_DAY = 86400000;

  function fromYMD(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / MS_DAY); }
  function ymd(n) { var dt = new Date(n * MS_DAY); return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() }; }
  function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function dow(n) { return ((n % 7) + 7 + 4) % 7; } // 1970-01-01 was a Thursday (4)
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(n) { var p = ymd(n); return p.y + "-" + pad(p.m) + "-" + pad(p.d); }
  function parse(s) {
    if (typeof s !== "string") return NaN;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.trim());
    if (!m) return NaN;
    var y = +m[1], mo = +m[2], d = +m[3];

    return fromYMD(y, mo, d);
  }
  function addMonths(y, m, k) { var t = (y * 12 + (m - 1)) + k; return { y: Math.floor(t / 12), m: (t % 12 + 12) % 12 + 1 }; }
  function clampDay(y, m, d) { return fromYMD(y, m, Math.min(d, dim(y, m))); }
  function todayLocal(date) { var dt = date || new Date(); return fromYMD(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }

  // ------------------------------------------------------------------ money
  var MAX_CENTS = 99999999999; // 999,999,999.99

  /* Parse what a person types: "12", "12.5", "12,50", "1,234.56", "1.234,56", "1 234,56", "$ 40", "-20" (if allowed).
     Rule: when both "." and "," appear, the last one is the decimal mark. When only one kind appears, it is a decimal
     mark only if it appears once and is followed by 1 or 2 digits; otherwise it groups thousands. */
  function parseMoney(input, opts) {
    opts = opts || {};
    if (typeof input === "number") input = String(input);
    if (typeof input !== "string") return null;
    var s = input.replace(/[\u2212\u2013]/g, "-").replace(/[\s\u00a0\u202f'\u2019]/g, "").replace(/[^0-9.,\-]/g, "");
    var neg = false;
    if (s.indexOf("-") !== -1) {
      if (s.lastIndexOf("-") !== 0 || !opts.allowNegative) return null;
      neg = true; s = s.slice(1);
    }
    if (!s || !/[0-9]/.test(s)) return null;
    var lastDot = s.lastIndexOf("."), lastComma = s.lastIndexOf(","), dec = -1;
    if (lastDot !== -1 && lastComma !== -1) dec = Math.max(lastDot, lastComma);
    else if (lastDot !== -1 || lastComma !== -1) {
      var ch = lastDot !== -1 ? "." : ",", idx = Math.max(lastDot, lastComma);
      var count = s.split(ch).length - 1, after = s.length - idx - 1;
      if (count === 1 && after >= 0 && after <= 2) dec = idx;
    }
    var intPart, frac;
    if (dec === -1) { intPart = s.replace(/[.,]/g, ""); frac = ""; }
    else { intPart = s.slice(0, dec); frac = s.slice(dec + 1); if (/[.,]/.test(frac) || intPart.indexOf(s.charAt(dec)) !== -1) return null; intPart = intPart.replace(/[.,]/g, ""); }
    if (!intPart) intPart = "0";
    if (!/^\d+$/.test(intPart) || !/^\d*$/.test(frac)) return null;
    intPart = intPart.replace(/^0+(?=\d)/, "");
    if (intPart.length > 9) return null;
    frac = (frac + "00").slice(0, 2);
    var cents = parseInt(intPart, 10) * 100 + parseInt(frac, 10);
    if (cents > MAX_CENTS) return null;
    return neg ? -cents : cents;
  }

  var NUMBER_FORMATS = {
    "1,234.56": { group: ",", dec: "." },
    "1.234,56": { group: ".", dec: "," },
    "1 234,56": { group: " ", dec: "," },
    "1'234.56": { group: "'", dec: "." }
  };
  var CURRENCIES = {
    USD: { symbol: "$", pos: "before" }, CAD: { symbol: "$", pos: "before" }, AUD: { symbol: "$", pos: "before" },
    GBP: { symbol: "£", pos: "before" }, EUR: { symbol: "€", pos: "after" }
  };

  /* settings: { currency, symbol (custom), numberFormat, symbolPos: "auto" | "before" | "after" } */
  function formatMoney(cents, settings, opts) {
    settings = settings || {}; opts = opts || {};
    var nf = NUMBER_FORMATS[settings.numberFormat] || NUMBER_FORMATS["1,234.56"];
    var cur = CURRENCIES[settings.currency];
    var sym = settings.currency === "CUSTOM" ? (settings.symbol || "") : (cur ? cur.symbol : "$");
    var pos = settings.symbolPos && settings.symbolPos !== "auto" ? settings.symbolPos : (cur ? cur.pos : "before");
    if (pos === "after" && nf.dec === "." && settings.currency === "EUR" && (!settings.symbolPos || settings.symbolPos === "auto")) pos = "before";
    var neg = cents < 0, a = Math.abs(Math.round(cents));
    var whole = Math.floor(a / 100), fr = a % 100;

    var body = !sym ? num : (pos === "after" ? num + " " + sym : sym + (sym.length > 1 ? " " : "") + num);
    return (neg ? "−" : "") + body;
  }

  // ------------------------------------------------------------------ pay schedule
  /* pay: { freq: "weekly" | "biweekly" | "semimonthly" | "monthly", anchor: "YYYY-MM-DD" (a real payday, weekly/biweekly),
            day1, day2 (semimonthly; 31 = last day), day (monthly; 31 = last day), weekend: "keep" | "before" | "after" } */
  function shiftWeekend(n, rule) {
    var w = dow(n);
    if (rule === "before") { if (w === 6) return n - 1; if (w === 0) return n - 2; }
    if (rule === "after") { if (w === 6) return n + 2; if (w === 0) return n + 1; }
    return n;
  }

  function rawPaydays(pay, from, to) {
    var out = [], k, n, y, m, p;
    if (pay.freq === "weekly" || pay.freq === "biweekly") {
      var step = pay.freq === "weekly" ? 7 : 14, a = parse(pay.anchor);
      if (isNaN(a)) return out;
      k = Math.ceil((from - a) / step);
      for (n = a + k * step; n <= to; n += step) out.push(n);
      return out;
    }
    p = ymd(from); var end = ymd(to), cur = { y: p.y, m: p.m };
    var days = pay.freq === "semimonthly" ? [Math.min(+pay.day1 || 1, 31), Math.min(+pay.day2 || 15, 31)] : [Math.min(+pay.day || 1, 31)];
    days.sort(function (a, b) { return a - b; });
    while (cur.y < end.y || (cur.y === end.y && cur.m <= end.m)) {
      for (var i = 0; i < days.length; i++) {
        n = clampDay(cur.y, cur.m, days[i]);
        if (out.length && out[out.length - 1] === n) continue;
        if (n >= from && n <= to) out.push(n);
      }
      cur = addMonths(cur.y, cur.m, 1);
    }
    return out;
  }

  function paydays(pay, from, to) {
    if (!pay || !pay.freq) return [];
    var rule = pay.weekend || "keep";
    var raw = rawPaydays(pay, from - 3, to + 3), out = [];
    for (var i = 0; i < raw.length; i++) {
      var n = shiftWeekend(raw[i], rule);
      if (n >= from && n <= to && out[out.length - 1] !== n) out.push(n);
    }
    return out;
  }
  function nextPayday(pay, today) { var l = paydays(pay, today + 1, today + 45); return l.length ? l[0] : today + 1; }
  function prevPayday(pay, today) { var l = paydays(pay, today - 45, today); return l.length ? l[l.length - 1] : today; }

  // ------------------------------------------------------------------ bills
  /* bill: { id, name, amount, start: "YYYY-MM-DD" (first due date), repeat: "month" | "week" | "once", every: n, skips: [] } */
  function occurrences(bill, from, to) {
    var s = parse(bill.start), out = [];
    if (isNaN(s) || to < from) return out;
    var every = Math.max(1, Math.floor(+bill.every || 1));
    if (bill.repeat === "once") { if (s >= from && s <= to) out.push(s); return out; }
    if (bill.repeat === "week") {
      var step = 7 * every, k = Math.max(0, Math.ceil((from - s) / step));
      for (var n = s + k * step; n <= to; n += step) out.push(n);
      return out;
    }
    var p = ymd(s), first = ymd(Math.max(from, s));
    var monthsFromStart = (first.y - p.y) * 12 + (first.m - p.m);
    var k2 = Math.max(0, Math.floor(monthsFromStart / every) - 1);
    for (var guard = 0; guard < 2000; guard++, k2++) {
      var mm = addMonths(p.y, p.m, k2 * every), d = clampDay(mm.y, mm.m, p.d);
      if (d > to) break;
      if (d >= from && d >= s) out.push(d);
    }
    return out;
  }

  function billPaid(state, billId, dueStr) {
    var ev = state.events || [];
    for (var i = 0; i < ev.length; i++) if (ev[i].type === "bill" && ev[i].billId === billId && ev[i].due === dueStr) return ev[i];
    return null;
  }
  function billSkipped(bill, dueStr) { return (bill.skips || []).indexOf(dueStr) !== -1; }

  // ------------------------------------------------------------------ balance and safe to spend
  var SIGN = { income: 1, spend: -1, bill: -1, save: -1, unsave: 1 };

  /* Current everyday-account balance = the balance you last typed + everything logged after that moment. */
  function balance(state) {
    var a = state.anchor || { amount: 0, t: 0 }, b = a.amount || 0, ev = state.events || [];
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.noBal || !SIGN[e.type] || !(e.t > a.t)) continue;
      b += SIGN[e.type] * e.amount;
    }
    return b;
  }

  function goalSaved(state, goal) {
    var s = goal.start || 0, ev = state.events || [];
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.goalId !== goal.id) continue;
      if (e.type === "save") s += e.amount; else if (e.type === "unsave") s -= e.amount;
    }
    return s;
  }

  /* Paydays that have arrived since we last counted pay. With autoPay on, the app adds them as income. */
  function duePaydays(state, today) {
    var pay = state.pay;
    if (!pay || !pay.freq) return [];
    var last = parse(pay.lastProcessed);
    if (isNaN(last)) return [];
    return paydays(pay, last + 1, today).slice(-12);
  }
  /* Returns { added: [income events], stale: bool }. After a long break (over 62 days) we don't guess: we stop
     counting old paydays and ask the person to type their balance again. */
  function materializePay(state, today, nowMs) {
    var res = { added: [], stale: false }, pay = state.pay;
    if (!pay || !pay.freq) return res;
    var last = parse(pay.lastProcessed);
    if (!isNaN(last) && today - last > 62) {
      pay.lastProcessed = fmt(prevPayday(pay, today));
      res.stale = true;
      return res;
    }
    var due = duePaydays(state, today);
    if (!due.length || (state.settings && state.settings.autoPay === false)) return res;
    for (var i = 0; i < due.length; i++) {
      var e = { id: "pay-" + fmt(due[i]) + "-" + (nowMs + i).toString(36), type: "income", amount: pay.amount || 0, date: fmt(due[i]), t: nowMs + i, auto: true };
      state.events.push(e); res.added.push(e);
    }
    pay.lastProcessed = fmt(due[due.length - 1]);
    return res;
  }

  function compute(state, today) {
    var pay = state.pay || {}, start = prevPayday(pay, today), next = nextPayday(pay, today);
    var bal = balance(state), bills = state.bills || [], list = [], reserved = 0, i, j;
    for (i = 0; i < bills.length; i++) {
      var b = bills[i], occ = occurrences(b, parse(b.start), next + 62);
      for (j = 0; j < occ.length; j++) {
        var d = occ[j], ds = fmt(d), paid = billPaid(state, b.id, ds), skipped = billSkipped(b, ds);
        var inWindow = d < next, overdue = d < today;

    const next = C.nextPayday(pay, d);
    const st = {
      setupDone: true, sample: true,
      settings: { currency: S ? S.settings.currency : "USD", numberFormat: S ? S.settings.numberFormat : "1,234.56", symbolPos: S ? S.settings.symbolPos : "auto",
        dateStyle: S ? S.settings.dateStyle : "md", theme: S ? S.settings.theme : "auto", autoPay: true, cushion: 5000, lastBackup: 0 },
      pay, anchor: { amount: 69000, t: now, date: f(d) },
      bills: [
        { id: "b-rent", name: T.sRent, amount: 115000, start: f(next + 2), repeat: "month", every: 1 },
        { id: "b-phone", name: T.sPhone, amount: 4500, start: f(d + 2), repeat: "month", every: 1 },
        { id: "b-stream", name: T.sStream, amount: 1599, start: f(d + 4), repeat: "month", every: 1 },

      ],
      events: [

        { id: "e2", type: "spend", amount: 475, date: f(d - 1), t: now - 8000, cat: "eating", note: T.sCoffee },
        { id: "e3", type: "spend", amount: 3800, date: f(d - 3), t: now - 7000, cat: "transport", note: T.sGas },
        { id: "e4", type: "spend", amount: 1230, date: f(d - 1), t: now - 6000, cat: "health", note: T.sPharmacy },
        { id: "e5", type: "spend", amount: 2250, date: f(d - 4), t: now - 5500, cat: "fun" },
        { id: "e6", type: "bill", amount: 6000, date: f(d - 3), t: now - 5000, billId: "b-net", due: f(d - 3), noBal: true },
        { id: "e7", type: "income", amount: 185000, date: pay.lastProcessed, t: now - 10000, auto: true }
      ],
      goals: [
        { id: "g-em", name: T.sEmergency, target: 100000, start: 34000, per: 2500 },

      ],
      debts: [
        { id: "d1", name: T.sCard, balance: 240000, apr: 22.9, min: 7500 },

        { id: "d3", name: T.sStore, balance: 38000, apr: 26.99, min: 2500 }
      ],
      debtExtra: 5000, debtMethod: "snowball", cats: S ? S.cats : defaultCats(), flags: {}
    };
    return C.sanitizeState(st, d).state;
  }

  function load() {
    if (DEMO) { S = sampleState(); return; }
    let raw = null;
    try {
      localStorage.setItem("doneenough.test", "1"); localStorage.removeItem("doneenough.test");
      raw = localStorage.getItem(KEY);
    } catch (e) { STORAGE_OK = false; }
    if (raw) {
      try { const r = C.sanitizeState(JSON.parse(raw), today()); if (r.ok) S = r.state; } catch (e) { S = null; }
    }
    if (!S) S = freshState();
    if (!S.cats.length) S.cats = defaultCats();
    S.events.forEach((e) => { if (e.t > lastT) lastT = e.t; });
    if (S.anchor.t > lastT) lastT = S.anchor.t;
  }

  function persist() {
    if (DEMO) return;
    try { localStorage.setItem(KEY, JSON.stringify(S)); STORAGE_OK = true; } catch (e) { STORAGE_OK = false; }
  }

  function tick() {
    if (!S.setupDone) return;
    const d = today(), r = C.materializePay(S, d, stamp());
    if (r.added.length) {
      lastT += r.added.length;
      S.flags.payNote = r.added[r.added.length - 1].id;
      S.flags.payNoteUntil = C.fmt(d + 3);
    }
    if (r.stale) S.flags.stale = true;
    if (r.added.length || r.stale) persist();
  }

  function commit(keepModal) {
    persist();
    let k = null;
    if (!keepModal && MODAL) { k = MODAL.opener; closeModal(true); }
    render();
    if (k) { const el = document.querySelector(k); if (el) el.focus({ preventScroll: true }); }
    announce();
  }

  // ------------------------------------------------------------------ render shell
  let R = null; // the latest compute() result

  function applyTheme() {
    const th = S.settings.theme;
    if (th === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", th);
    document.documentElement.lang = T.lang;
  }

  function render() {
    applyTheme();
    const active = document.activeElement, key = active && active.getAttribute ? focusKey(active) : null;
    R = S.setupDone ? C.compute(S, today()) : null;
    const low = !!(S.settings.low && S.setupDone);
    document.body.classList.toggle("low", low);
    let view;
    const inOnb = !S.setupDone || !!(UI.onb && UI.onb.step === 5);
    if (inOnb) view = onboardingView();
    else if (low) view = lowView();
    else view = ({ home: homeView, bills: billsView, spending: spendingView, goals: goalsView, debt: debtView, settings: settingsView }[UI.tab] || homeView)();
    $("app").innerHTML = `<div class="wrap">${topBar()}${banners()}${!inOnb && !low ? navBar() : ""}<main id="view" tabindex="-1">${view}</main>${footer()}</div>`;
    if (key) { const el = document.querySelector(key); if (el) el.focus({ preventScroll: true }); }
  }

  function focusKey(el) {
    if (el.id && el.id !== "view") return "#" + CSS.escape(el.id);
    const a = el.getAttribute("data-act");
    if (!a) return null;
    let k = `[data-act="${CSS.escape(a)}"]`;
    ["data-id", "data-due", "data-tab", "data-v"].forEach((n) => { const v = el.getAttribute(n); if (v != null) k += `[${n}="${CSS.escape(v)}"]`; });
    return k;
  }

  function topBar() {
    const low = S.settings.low;
    const lowBtn = S.setupDone ? `<button class="chip-btn" data-act="low" aria-pressed="${low ? "true" : "false"}">${icon(low ? "batFull" : "batLow")}<span class="lbl-long">${te(low ? "lowOff" : "lowOn")}</span><span class="sr">${low ? "" : te("lowHint")}</span></button>` : "";
    const saved = DEMO ? te("notSaved") : STORAGE_OK ? te("savedHere") : "";
    return `<header class="top"><div class="logo"><span class="mark">${icon("check")}<i></i></span><div><h1>${te("appName")}</h1><small>${te("tagline")}</small></div></div>
      <div class="top-actions"><span class="saved-state hide-low" aria-live="polite">${saved ? icon(DEMO ? "alert" : "lock") + saved : ""}</span>${lowBtn}${S.setupDone ? `<button class="chip-btn icon-btn show-phone hide-low" data-act="tab" data-tab="settings" aria-label="${te("settingsBtn")}">${icon("gear")}</button>` : ""}</div></header>`;
  }

  function banners() {
    let h = "";
    if (DEMO) h += `<div class="banner demo" role="note">${icon("star")}<div class="grow"><strong>${te("demoBanner")}</strong> ${te("demoBanner2")}</div>${S.setupDone ? `<button class="btn sm ghost hide-low" data-act="demoSetup">${te("onbStart")}</button>` : ""}</div>`;
    else if (S.sample && S.setupDone) h += `<div class="banner" role="note">${icon("alert")}<div class="grow">${te("sampleBanner")}</div><button class="btn sm primary" data-act="clearSample">${te("sampleClear")}</button></div>`;
    if (!DEMO && !STORAGE_OK) h += `<div class="banner" role="alert">${icon("alert")}<div class="grow">${te("storageBanner")}</div><button class="btn sm primary" data-act="backupSave">${te("backupSave")}</button></div>`;
    return h;
  }

  function navBar() {
    const tabs = [["home", "home", "tabHome"], ["bills", "bills", "tabBills"], ["spending", "wallet", "tabSpending"], ["goals", "target", "tabGoals"], ["debt", "debt", "tabDebt"], ["settings", "gear", "tabSettings"]];
    return `<nav class="tabs" aria-label="${te("navLabel")}">${tabs.map(([id, ic, lb]) => `<button class="tab t-${id}" data-act="tab" data-tab="${id}" ${UI.tab === id ? 'aria-current="page"' : ""}>${icon(ic)}<span>${te(lb)}</span></button>`).join("")}</nav>`
      + (S.setupDone ? `<div class="sr" aria-live="polite" id="live"></div>` : "");
  }

  function footer() {
    return `<footer class="foot hide-low"><span>${te("aboutAdvice")}</span><span>Done Enough Co. · Done is enough.</span></footer>`;
  }

  function announce() {
    const el = $("live");
    if (el && R) el.textContent = `${t("safeLabel")}: ${money(R.safe)}`;
  }

  // ------------------------------------------------------------------ hero
  function sizeClass(str) { const l = str.length; return l > 16 ? "l3" : l > 12 ? "l2" : l > 9 ? "l1" : ""; }

  function hero(opts) {
    opts = opts || {};
    const r = R, amt = money(r.safe), st = r.safe > 0 ? "good" : r.safe === 0 ? "zero" : "over";
    const statusIcon = st === "good" ? "check" : st === "zero" ? "alert" : "heart";
    const statusTxt = st === "good" ? te("statusGood") : st === "zero" ? te("statusZero") : te("statusOver");
    const payday = te("paydayIn", { n: r.daysLeft, date: dateLabel(r.nextPayday) });
    let sub;
    if (st === "good") sub = `<div class="hero-sub">${te("safePerDay", { amount: money(r.perDay) })}</div><div class="hero-sub2">${payday}</div>`;
    else if (st === "zero") sub = `<div class="hero-sub">${te("safeZero")}</div><div class="hero-sub2">${payday}</div>`;
    else sub = `<div class="hero-sub">${te("safeOver", { amount: money(-r.safe) })}</div><div class="hero-sub2">${payday}</div><p class="hero-kind">${te("safeOverKind")}</p>`;
    const math = UI.showMath ? `<div class="math" id="math">
        ${mathRow("", "mathBalance", r.balance)}${mathRow("−", "mathBills", r.billsReserved)}${mathRow("−", "mathGoals", r.goalsReserved)}${mathRow("−", "mathCushion", r.cushion)}
        <div class="math-row total"><span><span class="op">=</span>${te("mathSafe")}</span><span class="num">${esc(amt)}</span></div>
        <p class="math-note">${te("mathNote")}</p></div>` : "";
    const actions = opts.noActions ? "" : `<div class="hero-actions"><button class="btn primary big" data-act="spend">${icon("plus")}${te("addSpend")}</button><button class="btn big" data-act="balance">${te("updateBalance")}</button></div>`;
    return `<section class="panel hero" aria-labelledby="safe-label">
      <div class="hero-label" id="safe-label">${icon("wallet")}${te("safeLabel")}</div>
      <div class="hero-amount num ${sizeClass(amt)} ${st === "over" ? "over" : ""}" data-testid="safe">${esc(amt)}</div>
      <span class="status ${st}">${icon(statusIcon)}${statusTxt}</span>
      ${sub}
      ${opts.noMath ? "" : `<button class="link-btn" data-act="math" aria-expanded="${UI.showMath}" aria-controls="math">${te(UI.showMath ? "hideMath" : "howWorked")}</button>${math}`}
      ${actions}
    </section>`;
  }
  const mathRow = (op, k, v) => `<div class="math-row"><span><span class="op">${op}</span>${te(k)}</span><span class="num">${esc(money(v))}</span></div>`;

  // ------------------------------------------------------------------ bills (rows)
  function billIcon(name) {
    const n = (name || "").toLowerCase();
    const map = [[/rent|mortgage|miete|loyer|home|house/, "home"], [/electric|power|water|gas|energy|strom|heat|utilit/, "bolt"], [/phone|mobile|cell|handy/, "phone"],
      [/internet|wifi|broadband|cable/, "wifi"], [/insur/, "shield"], [/car|auto|fuel/, "car"], [/stream|netflix|tv|music|spotify|subscr|apps?\b/, "play"],
      [/card|loan|credit|debt|klarna|afterpay/, "card"], [/gym|health|doctor|pharm/, "health"], [/child|daycare|school|kid/, "kids"], [/pet|vet/, "paw"]];
    for (const [re, ic] of map) if (re.test(n)) return ic;
    return "bills";
  }
  function statusTag(it) {
    if (it.status === "skipped") return `<span class="tag plain">${te("skipped")}</span>`;
    if (it.status === "overdue") return `<span class="tag over">${icon("alert")}${te("overdueBy", { date: dateLabel(it.due, { noDow: true }) })}</span>`;
    if (it.status === "today") return `<span class="tag today">${icon("alert")}${te("dueToday")}</span>`;
    return "";
  }
  function billRow(it, opts) {
    opts = opts || {};
    const paid = it.status === "paid", skipped = it.status === "skipped", nm = it.bill.name;
    const when = it.status === "upcoming" ? `<span>${esc(dateLabel(it.due))} · ${esc(rel(it.due))}</span>` : it.status === "paid" || it.status === "skipped" ? `<span>${esc(dateLabel(it.due))}</span>` : "";
    const payBtn = skipped
      ? `<button class="btn sm ghost" data-act="unskip" data-id="${esc(it.bill.id)}" data-due="${it.dueStr}" aria-label="${esc(t("undo") + ": " + nm)}">${te("undo")}</button>`
      : `<button class="btn sm pay-btn" data-act="pay" data-id="${esc(it.bill.id)}" data-due="${it.dueStr}" aria-pressed="${paid}" aria-label="${esc(paid ? t("undo") + ": " + nm + " " + t("paidDone") : t("paidBtn") + ": " + nm)}">${icon(paid ? "check" : "circle")}${te(paid ? "paidDone" : "paidBtn")}</button>`;
    const skipBtn = it.status === "overdue" && !opts.noSkip ? `<button class="btn sm ghost" data-act="skip" data-id="${esc(it.bill.id)}" data-due="${it.dueStr}" aria-label="${esc(t("skipBtn") + ": " + nm)}">${te("skipBtn")}</button>` : "";
    return `<div class="item ${paid ? "is-paid" : ""} ${skipped ? "is-skipped" : ""}" data-bill-row="${esc(it.bill.id)}">
      <button class="item-btn" data-act="editBill" data-id="${esc(it.bill.id)}" data-due="${it.dueStr}"><span class="ic">${icon(billIcon(nm))}</span>
      <span class="main"><span class="name">${esc(nm)}</span><span class="meta">${statusTag(it)}${when}<span class="amt-inline num">${esc(money(it.amount))}</span></span></span></button>
      <span class="amt num">${esc(money(it.amount))}</span><span class="acts">${skipBtn}${payBtn}</span></div>`;
  }

  // ------------------------------------------------------------------ home
  function notes() {
    const d = today(), out = [];
    if (S.flags.stale) out.push(`<div class="note" role="status">${icon("heart")}<div class="body"><p>${te("noteStale")}</p><button class="btn sm primary" data-act="balance">${te("updateBalance")}</button></div></div>`);
    if (R.pendingPaydays.length) {
      const n = R.pendingPaydays.length;
      out.push(`<div class="note pay" role="status">${icon("coin")}<div class="body"><p>${te("notePending", { n, date: dateLabel(R.pendingPaydays[0]) })}</p>
        <div class="btn-row"><button class="btn sm primary" data-act="payYes">${te("notePendingYes", { amount: money(S.pay.amount * n) })}</button>
        <button class="btn sm" data-act="payOther">${te("notePendingOther")}</button><button class="btn sm ghost" data-act="payNo">${te("notePendingNo")}</button></div></div></div>`);
    }
    if (S.flags.payNote && C.parse(S.flags.payNoteUntil) >= d) {
      const ev = S.events.find((e) => e.id === S.flags.payNote);
      if (ev) out.push(`<div class="note pay" role="status">${icon("coin")}<div class="body"><p>${te("notePayAdded", { amount: money(ev.amount) })}</p>
        <div class="btn-row"><button class="btn sm" data-act="editEvent" data-id="${esc(ev.id)}">${te("notePayEdit")}</button><button class="btn sm ghost" data-act="dismissPay">${te("close")}</button></div></div></div>`);
    }
    if (!DEMO && !S.sample && !UI.dismissed.backup && (S.events.length || S.bills.length)) {
      const lb = S.settings.lastBackup, old = lb && Date.now() - lb > 14 * 86400000;
      if (!lb || old) out.push(`<div class="note" role="status">${icon("download")}<div class="body"><p>${te(lb ? "noteBackup" : "noteBackupNever")}</p>
        <div class="btn-row"><button class="btn sm primary" data-act="backupSave">${te("backupSave")}</button><button class="btn sm ghost" data-act="dismissBackup">${te("close")}</button></div></div></div>`);
    }
    return out.join("");
  }

  function nextBillsPanel(limit, opts) {
    opts = opts || {};
    const items = R.bills.filter((b) => b.status !== "paid" && b.status !== "skipped").slice(0, limit);
    let body;
    if (!S.bills.length) body = `<p class="empty">${te("noBillsYet")}</p><div class="btn-row" style="margin-top:12px"><button class="btn" data-act="addBill">${icon("plus")}${te("addFirstBill")}</button></div>`;
    else if (!items.length) body = `<p class="empty">${te("noBillsSoon")}</p>`;
    else body = `<div class="list">${items.map((it) => billRow(it, { noSkip: opts.noSkip })).join("")}</div>`;
    const more = opts.noMore ? "" : `<button class="link-btn" data-act="tab" data-tab="bills">${te("seeAllBills")}</button>`;
    return `<section class="panel" aria-labelledby="nb-h"><div class="panel-head"><h2 id="nb-h">${te("nextBills")}</h2>${more}</div>${body}</section>`;
  }

  function periodPanel() {
    const cats = Object.keys(R.byCat).sort((a, b) => R.byCat[b] - R.byCat[a]);
    const max = cats.length ? R.byCat[cats[0]] : 1;
    const rows = cats.slice(0, 5).map((id) => catRow(id, R.byCat[id], max)).join("");
    return `<section class="panel" aria-labelledby="pp-h"><div class="panel-head"><h2 id="pp-h">${te("periodTitle")}</h2><span class="muted small">${te("periodRange", { from: dateLabel(R.periodStart, { noDow: true }), to: dateLabel(R.nextPayday - 1, { noDow: true }) })}</span></div>
      <div class="two" style="margin-bottom:10px"><div><div class="muted small">${te("periodSpent")}</div><div class="result-big num" style="font-size:26px">${esc(money(R.spent))}</div></div>
      <div><div class="muted small">${te("periodIn")}</div><div class="result-big num" style="font-size:26px">${esc(money(R.incomeThisPeriod))}</div></div></div>
      ${rows || `<p class="empty">${te("noSpendYet")}</p>`}</section>`;
  }
  function catRow(id, amt, max) {
    const pct = Math.max(2, Math.round(amt * 100 / Math.max(1, max)));
    return `<div class="cat-row"><span class="ic">${icon(catIcon(id))}</span><div><div class="nm"><span>${esc(catName(id))}</span><span class="num">${esc(money(amt))}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div></div><span></span></div>`;
  }

  function goalsMini() {
    if (!R.goals.length) return "";
    return `<section class="panel" aria-labelledby="gm-h"><div class="panel-head"><h2 id="gm-h">${te("goalsTitle")}</h2><button class="link-btn" data-act="tab" data-tab="goals">${te("seeGoals")}</button></div>
      ${R.goals.slice(0, 3).map((g) => goalBlock(g, true)).join("")}</section>`;
  }

  function homeView() {
    return `<div class="grid"><div class="col">${hero()}${notes()}${periodPanel()}</div><div class="col">${nextBillsPanel(5)}${goalsMini()}</div></div>`;
  }

  function lowView() {
    return `<div class="low-wrap">${hero({ noMath: true, noActions: true })}${nextBillsPanel(3, { noMore: true, noSkip: true })}
      <button class="btn big ghost" data-act="low">${icon("batFull")}${te("lowOff")}</button></div>`;
  }

  // ------------------------------------------------------------------ bills view
  function billsView() {
    const seg = `<div class="seg" role="group" aria-label="${te("billsTitle")}"><button data-act="billsMode" data-v="list" aria-pressed="${UI.billsMode === "list"}">${icon("list")}${te("billsList")}</button><button data-act="billsMode" data-v="cal" aria-pressed="${UI.billsMode === "cal"}">${icon("calendar")}${te("billsCalendar")}</button></div>`;
    const head = `<div class="panel-head"><h2>${te("billsTitle")}</h2><div class="row">${seg}<button class="btn sm primary" data-act="addBill">${icon("plus")}${te("addBill")}</button></div></div>`;
    if (UI.billsMode === "cal") return `<section class="panel">${head}${calendar()}</section>`;
    const next2 = C.nextPayday(S.pay, R.nextPayday);
    const groups = [
      ["billsNeedsLook", R.bills.filter((b) => b.status === "overdue"), te("noteOverdueHint")],
      ["billsBeforePayday", R.bills.filter((b) => b.thisPeriod && b.status !== "overdue"), te("periodRange", { from: dateLabel(today(), { noDow: true }), to: dateLabel(R.nextPayday - 1, { noDow: true }) })],
      ["billsNextPeriod", R.bills.filter((b) => b.due >= R.nextPayday && b.due < next2), te("periodRange", { from: dateLabel(R.nextPayday, { noDow: true }), to: dateLabel(next2 - 1, { noDow: true }) })],
      ["billsLater", R.bills.filter((b) => b.due >= next2), ""]
    ];
    let body = "";
    for (const [k, items, sub] of groups) {
      if (k === "billsNeedsLook" && !items.length) continue;
      body += `<h3 class="section-title">${te(k)}${sub ? ` <span style="text-transform:none;letter-spacing:0;font-weight:700">· ${sub}</span>` : ""}</h3>`;
      body += items.length ? `<div class="list">${items.map((it) => billRow(it)).join("")}</div>` : `<p class="empty">${te(S.bills.length ? "billsNone" : "noBillsYet")}</p>`;
    }
    const all = S.bills.slice().sort((a, b) => a.name.localeCompare(b.name)).map((b) => {
      const code = Object.keys(REPEATS).find((k) => REPEATS[k][0] === b.repeat && REPEATS[k][1] === b.every) || "m1";
      const nx = C.occurrences(b, today(), today() + 800)[0];
      return `<div class="item"><button class="item-btn" data-act="editBill" data-id="${esc(b.id)}"><span class="ic">${icon(billIcon(b.name))}</span><span class="main"><span class="name">${esc(b.name)}</span>
        <span class="meta"><span>${te(REPEAT_LABEL[code])}</span>${nx != null ? `<span>· ${te("billNextDue", { date: dateLabel(nx) })}</span>` : ""}</span></span></button>
        <span class="amt num">${esc(money(b.amount))}</span><span class="acts"><button class="btn sm ghost" data-act="editBill" data-id="${esc(b.id)}" aria-label="${esc(t("edit") + ": " + b.name)}">${icon("pencil")}</button></span></div>`;
    }).join("");
    return `<div class="grid"><section class="panel">${head}${body}</section><section class="panel"><div class="panel-head"><h2>${te("billsAll")}</h2></div>${all ? `<div class="list">${all}</div>` : `<p class="empty">${te("noBillsYet")}</p>`}</section></div>`;
  }

  function calendar() {
    const d = today(), td = C.ymd(d);
    if (!UI.cal) UI.cal = { y: td.y, m: td.m };
    const { y, m } = UI.cal, first = C.fromYMD(y, m, 1), last = C.fromYMD(y, m, C.dim(y, m));
    const ws = S.settings.weekStart, lead = (C.dow(first) - ws + 7) % 7, gridStart = first - lead;
    const cells = Math.ceil((lead + (last - first + 1)) / 7) * 7;
    const pays = new Set(C.paydays(S.pay, gridStart, gridStart + cells - 1));
    const byDay = {};
    S.bills.forEach((b) => C.occurrences(b, gridStart, gridStart + cells - 1).forEach((o) => {
      const ds = C.fmt(o), paid = C.billPaid(S, b.id, ds), skipped = (b.skips || []).indexOf(ds) !== -1;
      (byDay[o] = byDay[o] || []).push({ bill: b, due: o, dueStr: ds, amount: paid ? paid.amount : b.amount, status: paid ? "paid" : skipped ? "skipped" : o < d ? "overdue" : o === d ? "today" : "upcoming" });
    }));
    const sel = UI.calSel != null ? UI.calSel : d;
    let h = `<div class="cal-head"><button class="chip-btn icon-btn" data-act="calMove" data-v="-1" aria-label="${te("calPrev")}">${icon("chevL")}</button><h3 aria-live="polite">${esc(monthYear(y, m))}</h3>
      <button class="chip-btn icon-btn" data-act="calMove" data-v="1" aria-label="${te("calNext")}">${icon("chevR")}</button></div><div class="cal" role="grid">`;
    for (let i = 0; i < 7; i++) h += `<div class="dn" aria-hidden="true">${esc(T.daysShort[(i + ws) % 7])}</div>`;
    for (let i = 0; i < cells; i++) {
      const n = gridStart + i, p = C.ymd(n), items = byDay[n] || [], isPay = pays.has(n);
      const label = [dateLabel(n), isPay ? t("calPayday") : "", ...items.map((it) => `${it.bill.name} ${money(it.amount)}${it.status === "paid" ? " (" + t("paidDone") + ")" : ""}`)].filter(Boolean).join(", ");
      const pills = (isPay ? `<span class="pill pay">${icon("coin")}<span class="amt-txt"> ${te("calPayday")}</span></span>` : "")
        + items.slice(0, 2).map((it) => `<span class="pill ${it.status === "paid" || it.status === "skipped" ? "paid" : ""}">${esc(it.bill.name)}</span>`).join("")
        + (items.length > 2 ? `<span class="pill">+${items.length - 2}</span>` : "");
      h += `<button class="day ${p.m !== m ? "out" : ""} ${n === d ? "today" : ""}" data-act="calDay" data-v="${n}" aria-pressed="${n === sel}" aria-label="${esc(label)}"><span class="d"><span>${p.d}</span></span>${pills}</button>`;
    }
    h += `</div><div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>${te("calLegendBill")}</span><span>${icon("coin")}${te("calLegendPay")}</span><span><i style="box-shadow:inset 0 0 0 2.5px var(--accent)"></i>${te("calToday")}</span></div>`;
    const its = byDay[sel] || [];
    h += `<h3 class="section-title" style="margin-top:18px">${esc(dateLabel(sel))}${pays.has(sel) ? " · " + te("calPayday") : ""}</h3>`;
    h += its.length ? `<div class="list">${its.map((it) => billRow(it)).join("")}</div>` : `<p class="empty">${te("calNothing")}</p>`;
    return h;
  }

  // ------------------------------------------------------------------ spending view
  function eventLabel(e) {
    if (e.type === "spend") return e.note ? `${catName(e.cat)} · ${e.note}` : catName(e.cat);
    if (e.type === "income") return e.auto ? t("evPay") : (e.note || t("evIncome"));
    if (e.type === "bill") { const b = S.bills.find((x) => x.id === e.billId); return `${t("evBill")}: ${b ? b.name : "—"}`; }
    const g = S.goals.find((x) => x.id === e.goalId);
    return `${t(e.type === "save" ? "evSave" : "evUnsave")}: ${g ? g.name : "—"}`;
  }
  function eventIcon(e) { return e.type === "spend" ? catIcon(e.cat) : e.type === "income" ? "coin" : e.type === "bill" ? "bills" : "target"; }
  function eventRow(e) {
    const plus = e.type === "income" || e.type === "unsave";
    const amt = (plus ? "+" : "−") + money(e.amount);
    const extra = e.noBal ? ` · ${te("noBalanceEffect")}` : "";
    return `<div class="item"><button class="item-btn" data-act="editEvent" data-id="${esc(e.id)}"><span class="ic">${icon(eventIcon(e))}</span><span class="main"><span class="name">${esc(eventLabel(e))}</span>
      <span class="meta"><span>${esc(dateLabel(C.parse(e.date)))}${extra}</span></span></span></button><span class="amt num" ${plus ? 'style="color:var(--ok-ink)"' : ""}>${esc(amt)}</span></div>`;
  }
  function spendingView() {
    const cats = Object.keys(R.byCat).sort((a, b) => R.byCat[b] - R.byCat[a]), max = cats.length ? R.byCat[cats[0]] : 1;
    let evs = S.events.slice();
    if (UI.act === "period") evs = evs.filter((e) => { const n = C.parse(e.date); return n >= R.periodStart && n <= today(); });
    evs.sort((a, b) => C.parse(b.date) - C.parse(a.date) || b.t - a.t);
    const total = evs.length;
    evs = evs.slice(0, 300);
    const seg = `<div class="seg" role="group" aria-label="${te("activity")}"><button data-act="actMode" data-v="period" aria-pressed="${UI.act === "period"}">${te("activityPeriod")}</button><button data-act="actMode" data-v="all" aria-pressed="${UI.act === "all"}">${te("activityAll")}</button></div>`;
    return `<div class="grid"><div class="col"><section class="panel"><div class="panel-head"><h2>${te("spendTitle")}</h2></div>
        <div class="btn-row"><button class="btn primary big" data-act="spend" style="flex:1 1 200px">${icon("plus")}${te("addSpend")}</button><button class="btn big" data-act="income" style="flex:1 1 160px">${icon("arrowIn")}${te("addIncome")}</button></div></section>
        <section class="panel"><div class="panel-head"><h2>${te("byCategory")}</h2><span class="muted small">${te("activityPeriod")}: ${esc(money(R.spent))}</span></div>
        ${cats.length ? cats.map((id) => catRow(id, R.byCat[id], max)).join("") : `<p class="empty">${te("noSpendYet")}</p>`}</section></div>
      <section class="panel"><div class="panel-head"><h2>${te("activity")}</h2>${seg}</div>
        ${evs.length ? `<div class="list">${evs.map(eventRow).join("")}</div>${total > 300 ? `<p class="muted small">300 / ${total}</p>` : ""}` : `<p class="empty">${te("activityNone")}</p>`}</section></div>`;
  }

  // ------------------------------------------------------------------ goals view
  function goalBlock(g, mini) {
    const done = g.saved >= g.goal.target && g.goal.target > 0;
    let hint = "";
    if (!mini && g.goal.by && !done) {
      const by = C.parse(g.goal.by), pd = C.paydays(S.pay, today() + 1, by).length;
      if (pd > 0) {
        const need = Math.ceil(g.left / pd);
        hint = g.goal.per && g.goal.per * pd >= g.left ? te("goalOnTrack", { date: dateLabel(by, { noDow: true }) }) : te("goalNeedPer", { amount: money(need), date: dateLabel(by, { noDow: true }) });
      }
    }
    const btns = mini ? "" : `<div class="btn-row" style="margin-top:8px"><button class="btn sm primary" data-act="goalAdd" data-id="${esc(g.goal.id)}">${icon("plus")}${te("goalAdd")}</button>
      <button class="btn sm" data-act="goalTake" data-id="${esc(g.goal.id)}">${te("goalTake")}</button><button class="btn sm ghost" data-act="editGoal" data-id="${esc(g.goal.id)}">${icon("pencil")}${te("edit")}</button></div>`;
    return `<div class="goal"><div class="goal-top"><h3>${esc(g.goal.name)}</h3><span class="num" style="font-weight:800">${te("goalSavedOf", { saved: money(g.saved), target: money(g.goal.target) })}</span></div>
      <div class="bar ${done ? "done" : ""}" role="progressbar" aria-label="${esc(g.goal.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${g.pct}"><i style="width:${Math.max(2, g.pct)}%"></i></div>
      <div class="meta small row">${done ? `<span class="tag ok">${icon("check")}${te("goalDone")}</span>` : `<span style="font-weight:800">${te("goalPct", { n: g.pct })}</span>`}
      ${g.goal.per && !done ? `<span class="muted">· ${te("goalEveryPayday", { amount: money(g.goal.per) })}</span>` : ""}${hint ? `<span class="muted">· ${hint}</span>` : ""}</div>${btns}</div>`;
  }
  function goalsView() {
    return `<section class="panel" style="max-width:760px"><div class="panel-head"><h2>${te("goalsTitle")}</h2><button class="btn sm primary" data-act="addGoal">${icon("plus")}${te("addGoal")}</button></div>
      ${R.goals.length ? R.goals.map((g) => goalBlock(g, false)).join("") : `<p class="empty">${te("goalsEmpty")}</p>`}</section>`;
  }

  // ------------------------------------------------------------------ debt view
  function monthsLabel(m) { const td = C.ymd(today()), mm = C.addMonths(td.y, td.m, m); return `${T.monthsShort[mm.m - 1]} ${mm.y}`; }
  function debtView() {
    const list = S.debts.map((d) => `<div class="item"><button class="item-btn" data-act="editDebt" data-id="${esc(d.id)}"><span class="ic">${icon("card")}</span><span class="main"><span class="name">${esc(d.name)}</span>
      <span class="meta"><span>${esc(String(d.apr).replace(".", C.NUMBER_FORMATS[S.settings.numberFormat].dec))}% APR · ${te("debtMin")}: ${esc(money(d.min))}</span></span></span></button><span class="amt num">${esc(money(d.balance))}</span></div>`).join("");
    let result = "";
    if (S.debts.length) {
      const plan = C.debtPlan(S.debts, S.debtExtra, S.debtMethod);
      if (!plan.ok) result = `<p class="empty" role="status">${te(plan.reason === "too-long" ? "debtTooLong" : "debtTooLow")}</p>`;
      else if (!plan.empty) {
        const sb = C.debtPlan(S.debts, S.debtExtra, "snowball"), av = C.debtPlan(S.debts, S.debtExtra, "avalanche");
        let cmp = "";
        if (sb.ok && av.ok) {
          const saves = sb.totalInterest - av.totalInterest, sooner = (av.order[0] ? av.order[0].month : 0) - (sb.order[0] ? sb.order[0].month : 0);
          cmp = saves <= 100 && sooner <= 0 ? te("debtCompareSame") : sooner > 0 ? te("debtCompare", { amount: money(Math.max(0, saves)), n: sooner }) : te("debtCompareSameFirst", { amount: money(Math.max(0, saves)) });
        }
        result = `<div class="result-big">${te("debtFreeIn", { n: plan.months })}</div>
          <p class="muted" style="margin:0 0 8px">${te("debtFreeBy", { date: monthsLabel(plan.months) })} · ${te("debtInterest", { amount: money(plan.totalInterest) })} · ${te("debtMonthly", { amount: money(plan.monthlyPayment) })}</p>
          <h3 class="section-title">${te("debtOrder")}</h3><ol class="order">${plan.order.map((o, i) => `<li><b class="n">${i + 1}</b><span style="flex:1;font-weight:800;overflow-wrap:anywhere">${esc(o.name)}</span><span class="muted small">${te("debtPaidOff", { date: monthsLabel(o.month) })}</span></li>`).join("")}</ol>
          ${cmp ? `<p style="margin-top:12px">${cmp}</p>` : ""}`;
      }
    }
    return `<div class="grid"><div class="col"><div class="disclaimer" role="note">${icon("alert")}<div><strong>${te("debtEstimate")}</strong> ${te("debtEstimateLong")}</div></div>
      <section class="panel"><div class="panel-head"><h2>${te("debtTitle")}</h2><button class="btn sm primary" data-act="addDebt">${icon("plus")}${te("addDebt")}</button></div>
      ${list ? `<div class="list">${list}</div>` : `<p class="empty">${te("debtEmpty")}</p>`}<p class="muted small" style="margin-top:12px">${te("debtBillsNote")}</p></section></div>
      <section class="panel"><div class="field"><label for="debt-extra">${te("debtExtra")}</label>${moneyInput("debt-extra", S.debtExtra, { set: "debtExtra" })}</div>
      <div class="field"><span class="lbl" id="dm-l">${te("debtMethod")}</span><div class="choice" role="group" aria-labelledby="dm-l">
        <button data-act="debtMethod" data-v="snowball" aria-pressed="${S.debtMethod === "snowball"}"><span><b>${te("snowball")}</b><br><span class="small muted">${te("snowballHint")}</span></span></button>
        <button data-act="debtMethod" data-v="avalanche" aria-pressed="${S.debtMethod === "avalanche"}"><span><b>${te("avalanche")}</b><br><span class="small muted">${te("avalancheHint")}</span></span></button></div></div>
      ${result}</section></div>`;
  }

  // ------------------------------------------------------------------ settings
  function opt(v, label, cur) { return `<option value="${esc(v)}" ${String(v) === String(cur) ? "selected" : ""}>${esc(label)}</option>`; }
  function sel(id, set, options, cur) { return `<select class="input" id="${id}" data-set="${set}">${options.map(([v, l]) => opt(v, l, cur)).join("")}</select>`; }
  function dayOptions() { const o = []; for (let i = 1; i <= 30; i++) o.push([i, String(i)]); o.push([31, t("lastDay")]); return o; }
  function moneyInput(id, cents, o) {
    o = o || {};
    const si = symInfo(), v = cents == null || cents === "" ? "" : typeof cents === "string" ? cents : moneyPlain(cents);
    return `<div class="money-wrap ${si.after ? "sym-after" : ""} ${o.big ? "big-wrap" : ""}"><span class="sym ${si.after ? "after" : ""}" aria-hidden="true">${esc(si.sym)}</span>
      <input class="input num ${o.big ? "big" : ""}" id="${id}" name="${o.name || id}" inputmode="${o.neg ? "text" : "decimal"}" autocomplete="off" value="${esc(v)}" ${o.set ? `data-set="${o.set}"` : ""} ${o.onb ? `data-onb="${o.onb}"` : ""} ${o.auto ? "autofocus" : ""} ${o.desc ? `aria-describedby="${o.desc}"` : ""} placeholder="${o.placeholder || "0"}"></div>`;
  }
  function payFields(prefix, p) {
    const freq = sel(prefix + "freq", "pay.freq", [["weekly", t("freqWeekly")], ["biweekly", t("freqBiweekly")], ["semimonthly", t("freqSemimonthly")], ["monthly", t("freqMonthly")]], p.freq);
    let when;
    if (p.freq === "weekly" || p.freq === "biweekly") when = `<div class="field"><label for="${prefix}next">${te("setNextPayday")}</label><input type="date" class="input" id="${prefix}next" data-set="pay.anchor" value="${C.fmt(C.nextPayday(p, today() - 1))}"></div>`;
    else if (p.freq === "semimonthly") when = `<div class="two"><div class="field"><label for="${prefix}d1">${te("setDay1")}</label>${sel(prefix + "d1", "pay.day1", dayOptions(), p.day1)}</div><div class="field"><label for="${prefix}d2">${te("setDay2")}</label>${sel(prefix + "d2", "pay.day2", dayOptions(), p.day2)}</div></div>`;
    else when = `<div class="field"><label for="${prefix}d">${te("setDay")}</label>${sel(prefix + "d", "pay.day", dayOptions(), p.day)}</div>`;
    return `<div class="field"><label for="${prefix}freq">${te("setFreq")}</label>${freq}</div>${when}
      <div class="field"><label for="${prefix}wk">${te("setWeekend")}</label>${sel(prefix + "wk", "pay.weekend", [["keep", t("weekendKeep")], ["before", t("weekendBefore")], ["after", t("weekendAfter")]], p.weekend)}</div>`;
  }
  function moneyFormatFields() {
    const st = S.settings;
    return `<div class="two"><div class="field"><label for="s-cur">${te("setCurrency")}</label>${sel("s-cur", "settings.currency", [["USD", "USD $"], ["EUR", "EUR €"], ["GBP", "GBP £"], ["CAD", "CAD $"], ["AUD", "AUD $"], ["CUSTOM", t("curCustom")]], st.currency)}</div>
      <div class="field"><label for="s-nf">${te("setNumFmt")}</label>${sel("s-nf", "settings.numberFormat", Object.keys(C.NUMBER_FORMATS).map((k) => [k, k]), st.numberFormat)}</div></div>
      ${st.currency === "CUSTOM" ? `<div class="field"><label for="s-sym">${te("setSymbol")}</label><input class="input" id="s-sym" data-set="settings.symbol" maxlength="6" value="${esc(st.symbol)}"></div>` : ""}`;
  }
  function settingsView() {
    const st = S.settings, p = S.pay;
    const catsHtml = S.cats.map((c) => `<div class="item"><span class="ic">${icon(c.icon)}</span><div class="main"><input class="input" aria-label="${esc(t("catRename") + ": " + catName(c.id))}" data-cat-name="${esc(c.id)}" value="${esc(catName(c.id))}" maxlength="40"></div>
      <button class="btn sm ghost" data-act="catHide" data-id="${esc(c.id)}" aria-pressed="${c.hidden}">${te(c.hidden ? "catShow" : "catHide")}</button></div>`).join("");
    const lb = st.lastBackup ? te("backupLast", { date: dateLabel(C.todayLocal(new Date(st.lastBackup))) }) : te("backupNever");
    const data = DEMO ? `<p class="empty">${te("demoNoSave")}</p>` : `<p class="lead">${te("dataWhere")}</p><p class="small muted">${lb}</p>
      <div class="stack"><button class="btn primary" data-act="backupSave">${icon("download")}${te("backupSave")}</button>
      <button class="btn" data-act="backupRestore">${icon("upload")}${te("backupRestore")}</button><input type="file" id="restore-file" accept=".json,application/json,text/plain" hidden>
      <div class="two"><button class="btn sm ghost" data-act="backupCopy">${icon("copy")}${te("backupCopy")}</button><button class="btn sm ghost" data-act="backupPaste">${te("backupPaste")}</button></div></div>`;
    return `<div class="grid"><div class="col">
      <section class="panel"><h2 style="margin-bottom:12px">${te("setPay")}</h2>${payFields("s-", p)}
        <div class="field"><label for="s-amt">${te("setPayAmount")}</label>${moneyInput("s-amt", p.amount, { set: "pay.amount" })}</div>
        <label class="toggle"><input type="checkbox" data-set="settings.autoPay" ${st.autoPay ? "checked" : ""}>${te("setAutoPay")}</label><p class="small muted" style="margin:0">${te("setAutoPayHint")}</p></section>
      <section class="panel"><h2 style="margin-bottom:12px">${te("setMoney")}</h2>${moneyFormatFields()}
        <div class="field"><label for="s-sp">${te("setSymPos")}</label>${sel("s-sp", "settings.symbolPos", [["auto", t("symAuto")], ["before", t("symBefore")], ["after", t("symAfter")]], st.symbolPos)}</div>
        <div class="two"><div class="field"><label for="s-ds">${te("setDateStyle")}</label>${sel("s-ds", "settings.dateStyle", [["md", t("dateMD")], ["dm", t("dateDM")]], st.dateStyle)}</div>
        <div class="field"><label for="s-ws">${te("setWeekStart")}</label>${sel("s-ws", "settings.weekStart", [[0, t("weekSun")], [1, t("weekMon")]], st.weekStart)}</div></div>
        <div class="field"><label for="s-cush">${te("setCushion")}</label>${moneyInput("s-cush", st.cushion, { set: "settings.cushion", desc: "s-cush-h" })}<span class="hint" id="s-cush-h">${te("setCushionHint")}</span></div></section>
      <section class="panel"><h2 style="margin-bottom:12px">${te("setLook")}</h2><div class="field"><label for="s-th">${te("setTheme")}</label>${sel("s-th", "settings.theme", [["auto", t("themeAuto")], ["light", t("themeLight")], ["dark", t("themeDark")]], st.theme)}</div></section>
      </div><div class="col">
      <section class="panel"><h2 style="margin-bottom:12px">${te("setData")}</h2>${data}</section>
      <section class="panel"><h2 style="margin-bottom:12px">${te("setCats")}</h2><div class="list">${catsHtml}</div>
        <div class="row" style="margin-top:12px"><input class="input" id="new-cat" placeholder="${te("catName")}" aria-label="${te("catName")}" maxlength="40" style="flex:1 1 160px"><button class="btn sm" data-act="catAdd">${icon("plus")}${te("catAdd")}</button></div></section>
      <section class="panel"><h2 style="margin-bottom:12px">${te("setAbout")}</h2><p>${te("aboutText", { version: VERSION })}</p><p><strong>${te("aboutAdvice")}</strong></p><p class="small muted">${te("aboutFonts")}<br>${te("aboutMade")}</p>
        <div class="btn-row"><button class="btn sm ghost" data-act="loadSample">${te("dataSample")}</button><button class="btn sm danger" data-act="clearAll">${icon("trash")}${te("dataClear")}</button></div></section>
      </div></div>`;
  }

  function setPath(path, raw, el) {
    const [obj, key] = path.split(".");
    const target = obj === "debtExtra" ? S : S[obj];
    let v = raw;
    if (["amount", "cushion"].includes(key) || path === "debtExtra") {
      v = C.parseMoney(raw);
      if (v == null) { if (el) { el.setAttribute("aria-invalid", "true"); toast(t("amountInvalid")); } return; }
    } else if (["day1", "day2", "day", "weekStart"].includes(key)) v = parseInt(raw, 10);
    else if (key === "autoPay") v = !!raw;
    else if (key === "anchor" && isNaN(C.parse(raw))) return;
    if (path === "debtExtra") S.debtExtra = v; else target[key] = v;
    if (obj === "pay" && key !== "amount") S.pay.lastProcessed = C.fmt(C.prevPayday(S.pay, today()));
    commit(true);
  }

  // ------------------------------------------------------------------ onboarding
  function onbDraft() {
    if (!UI.onb) UI.onb = { step: 0, next: "", amount: "", balance: "", cushion: 0, bills: [], err: {} };
    return UI.onb;
  }
  function onboardingView() {
    const o = onbDraft(), total = 4, p = S.pay;
    const err = (k) => (o.err[k] ? `<span class="err" id="err-${k}" role="alert">${icon("alert")}${te(o.err[k])}</span>` : "");
    const prog = (n) => `<div class="stepno">${te("onbStep", { n, total })}</div><div class="progress" aria-hidden="true"><i style="width:${n * 100 / total}%"></i></div>`;
    const nav = (n, nextLabel) => `<div class="sheet-foot">${n > 0 ? `<button class="btn ghost" data-act="onbBack">${te("back")}</button>` : ""}<button class="btn primary" data-act="onbNext">${te(nextLabel || "next")}</button></div>`;
    let h;
    if (o.step === 0) {
      h = `<h2>${te("onbWelcome")}</h2><p class="lead">${te("onbWelcomeText")}</p>
        <div class="welcome-art"><span class="tag ok">${icon("lock")}Offline</span><span class="tag ok">${icon("check")}${te("safeLabel")}</span></div>
        <div class="stack"><button class="btn primary big" data-act="onbNext">${te("onbStart")}</button><button class="btn big ghost" data-act="useSample">${te("onbSample")}</button></div>`;
    } else if (o.step === 1) {
      const fr = [["weekly", "freqWeekly"], ["biweekly", "freqBiweekly"], ["semimonthly", "freqSemimonthly"], ["monthly", "freqMonthly"]];
      let when;
      if (p.freq === "weekly" || p.freq === "biweekly") when = `<div class="field"><label for="o-next">${te("onbQNext")}</label><input type="date" class="input" id="o-next" data-onb="next" value="${esc(o.next)}" ${o.err.next ? 'aria-invalid="true" aria-describedby="err-next"' : ""}>${err("next")}</div>`;
      else when = payFields("o-", p).replace(/<div class="field"><label for="o-freq">[\s\S]*?<\/select><\/div>/, "");
      h = `${prog(1)}<h2 id="q1">${te("onbQFreq")}</h2><div class="choice" role="group" aria-labelledby="q1" style="margin-top:14px">${fr.map(([v, k]) => `<button data-act="onbFreq" data-v="${v}" aria-pressed="${p.freq === v}">${icon("calendar")}${te(k)}</button>`).join("")}</div>${when}${nav(1)}`;
    } else if (o.step === 2) {

        <div class="field">${moneyInput("o-amt", o.amount, { onb: "amount", big: true, auto: true, desc: o.err.amount ? "err-amount" : "" })}${err("amount")}</div>${moneyFormatFields()}${nav(2)}`;
    } else if (o.step === 3) {
      h = `${prog(3)}<h2><label for="o-bal">${te("onbQBalance")}</label></h2><p class="lead">${te("onbQBalanceHint")}</p>
        <div class="field">${moneyInput("o-bal", o.balance, { onb: "balance", big: true, auto: true, neg: true, desc: o.err.balance ? "err-balance" : "" })}${err("balance")}</div>
        <div class="field"><span class="lbl" id="cush-l">${te("onbQCushion")}</span><div class="chips" role="group" aria-labelledby="cush-l">${[0, 2500, 5000, 10000].map((c) => `<button data-act="onbCushion" data-v="${c}" aria-pressed="${o.cushion === c}">${c ? esc(money(c)) : te("onbNoCushion")}</button>`).join("")}</div><span class="hint">${te("setCushionHint")}</span></div>${nav(3)}`;
    } else if (o.step === 4) {
      const chips = T.onbBillChips.map((n) => `<button data-act="onbChip" data-v="${esc(n)}" aria-pressed="${o.bills.some((b) => b.name === n)}">${icon(billIcon(n))}${esc(n)}</button>`).join("");
      const rows = o.bills.map((b, i) => `<div class="onb-bill"><div class="three">
        <div class="field"><label for="ob-n${i}">${te("billName")}</label><input class="input" id="ob-n${i}" data-onb="bills.${i}.name" value="${esc(b.name)}" maxlength="80"></div>
        <div class="field"><label for="ob-a${i}">${te("billAmount")}</label>${moneyInput("ob-a" + i, b.amount, { onb: "bills." + i + ".amount" })}</div>
        <div class="field"><label for="ob-d${i}">${te("billDue")}</label><input type="date" class="input" id="ob-d${i}" data-onb="bills.${i}.due" value="${esc(b.due)}"></div></div>
        <div class="row" style="margin-top:8px"><select class="input" style="flex:1" aria-label="${te("billRepeat")}" data-onb="bills.${i}.repeat">${Object.keys(REPEATS).map((k) => opt(k, t(REPEAT_LABEL[k]), b.repeat)).join("")}</select>
        <button class="btn sm ghost" data-act="onbRemove" data-v="${i}" aria-label="${esc(t("onbRemove") + ": " + (b.name || ""))}">${icon("x")}${te("onbRemove")}</button></div>${b.err ? `<span class="err" role="alert">${icon("alert")}${te(b.err)}</span>` : ""}</div>`).join("");
      h = `${prog(4)}<h2>${te("onbQBills")}</h2><p class="lead">${te("onbQBillsHint")}</p><div class="chips">${chips}</div>${rows}
        <button class="btn sm ghost" data-act="onbChip" data-v="">${icon("plus")}${te("onbAnother")}</button>${nav(4, "finish")}`;
    } else {
      const r = C.compute(S, today());
      R = r;
      h = `<h2>${te("onbDone")}</h2><p class="lead">${te("onbDoneText")}</p>${hero({ noActions: true })}<div class="stack" style="margin-top:16px"><button class="btn primary big" data-act="onbGo">${te("onbGo")}</button></div>`;
    }
    return `<div class="onb"><section class="panel">${h}</section></div>`;
  }

  function onbValidate() {
    const o = onbDraft(), p = S.pay;
    o.err = {};
    if (o.step === 1 && (p.freq === "weekly" || p.freq === "biweekly")) {
      if (isNaN(C.parse(o.next))) o.err.next = "onbNeedDate"; else p.anchor = o.next;
    }
    if (o.step === 2) { const v = C.parseMoney(o.amount); if (v == null || v <= 0) o.err.amount = "onbNeedAmount"; else p.amount = v; }
    if (o.step === 3) { const v = C.parseMoney(o.balance, { allowNegative: true }); if (v == null) o.err.balance = "onbNeedBalance"; else o.balanceC = v; }
    if (o.step === 4) {
      let bad = false;
      o.bills.forEach((b) => {
        b.err = "";
        const a = C.parseMoney(b.amount), d = C.parse(b.due);
        if (!b.name.trim() && !b.amount && !b.due) return;
        if (!b.name.trim()) { b.err = "required"; bad = true; } else if (a == null || a <= 0) { b.err = "amountInvalid"; bad = true; } else if (isNaN(d)) { b.err = "dateInvalid"; bad = true; }
      });
      if (bad) o.err.bills = true;
    }
    return !Object.keys(o.err).length;
  }

  function onbFinish() {
    const o = onbDraft(), d = today();
    S.pay.lastProcessed = C.fmt(C.prevPayday(S.pay, d));
    S.anchor = { amount: o.balanceC || 0, t: stamp(), date: C.fmt(d) };
    S.settings.cushion = o.cushion || 0;
    S.bills = o.bills.filter((b) => b.name.trim() && C.parseMoney(b.amount) > 0 && !isNaN(C.parse(b.due))).map((b) => ({
      id: "b" + uid(), name: b.name.trim().slice(0, 80), amount: C.parseMoney(b.amount), start: b.due, repeat: REPEATS[b.repeat][0], every: REPEATS[b.repeat][1], skips: [] }));
    S.setupDone = true; S.sample = false; S.flags = { stale: false, payNote: "", payNoteUntil: "" };
    UI.tab = "home";
  }

  // ------------------------------------------------------------------ modal
  let MODAL = null;
  function openModal(title, body, opts) {
    opts = opts || {};
    const opener = document.activeElement;
    MODAL = { submit: opts.submit, opener: opener && focusKey(opener), actions: opts.actions || {} };
    const m = $("modal");
    m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title"><form id="m-form" novalidate><div class="sheet-head"><h2 id="m-title">${esc(title)}</h2>
      <button type="button" class="chip-btn icon-btn" data-act="close" aria-label="${te("close")}">${icon("x")}</button></div>${body}</form></div>`;
    m.hidden = false;
    document.body.style.overflow = "hidden";
    const f = m.querySelector("[autofocus]") || m.querySelector("input:not([type=hidden]),select,textarea,button");
    if (f) setTimeout(() => f.focus(), 30);
  }
  function closeModal(noFocus) {
    const m = $("modal");
    if (m.hidden) return;
    m.hidden = true; m.innerHTML = ""; document.body.style.overflow = "";
    const k = MODAL && MODAL.opener;
    MODAL = null;
    if (!noFocus && k) { const el = document.querySelector(k); if (el) el.focus(); }
  }
  function fieldErr(id, k) {
    const el = $(id);
    if (!el) return;
    el.setAttribute("aria-invalid", "true");
    const f = el.closest(".field");
    if (f && !f.querySelector(".err")) f.insertAdjacentHTML("beforeend", `<span class="err" role="alert">${icon("alert")}${te(k)}</span>`);
    el.focus();
  }
  const val = (id) => { const el = $(id); return el ? el.value : ""; };
  const foot = (extra) => `<div class="sheet-foot">${extra || ""}<button type="button" class="btn ghost" data-act="close">${te("cancel")}</button><button type="submit" class="btn primary">${te("save")}</button></div>`;

  function confirmBox(text, yesLabel, onYes, danger) {
    openModal(t("yes") + "?", `<p>${esc(text)}</p><div class="sheet-foot"><button type="button" class="btn ghost" data-act="close">${te("cancel")}</button>
      <button type="submit" class="btn ${danger ? "danger" : "primary"}">${esc(yesLabel)}</button></div>`, { submit: () => { onYes(); return true; } });
  }

  function billDialog(id) {

    const nextDue = b ? (C.occurrences(b, today(), today() + 800)[0]) : null;
    openModal(t(b ? "editBill" : "addBill"), `<div class="field"><label for="b-name">${te("billName")}</label><input class="input" id="b-name" maxlength="80" value="${esc(b ? b.name : "")}" autofocus></div>

      <div class="two"><div class="field"><label for="b-due">${te("billDue")}</label><input type="date" class="input" id="b-due" value="${b ? C.fmt(nextDue != null ? nextDue : C.parse(b.start)) : ""}"></div>
      <div class="field"><label for="b-rep">${te("billRepeat")}</label><select class="input" id="b-rep">${Object.keys(REPEATS).map((k) => opt(k, t(REPEAT_LABEL[k]), code)).join("")}</select></div></div>
      ${foot(b ? `<button type="button" class="btn danger" data-act="delBill" data-id="${esc(b.id)}">${icon("trash")}${te("del")}</button>` : "")}`,
    { submit: () => {

      if (!name) { fieldErr("b-name", "required"); return false; }
      if (a == null || a <= 0) { fieldErr("b-amt", "amountInvalid"); return false; }
      if (isNaN(C.parse(due))) { fieldErr("b-due", "dateInvalid"); return false; }
      if (b) {
        // keep history: a changed schedule starts from the new date, earlier paid dates stay paid
        Object.assign(b, { name: name.slice(0, 80), amount: a });
        if (nextDue == null || C.fmt(nextDue) !== due || code !== val("b-rep")) Object.assign(b, { start: due, repeat: rep[0], every: rep[1] });
      } else S.bills.push({ id: "b" + uid(), name: name.slice(0, 80), amount: a, start: due, repeat: rep[0], every: rep[1], skips: [] });
      commit(); toast(t("billSaved")); return true;
    } });
