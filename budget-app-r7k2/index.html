  // ------------------------------------------------------------------ backup
  function backupSave() {
    if (DEMO) { toast(t("demoNoSave")); return; }
    const data = JSON.stringify(C.makeBackup(S, Date.now()), null, 1);
    const blob = new Blob([data], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `done-enough-budget-backup-${C.fmt(today())}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    S.settings.lastBackup = Date.now();
    UI.dismissed.backup = true;
    commit(true);
    toast(t("backupSaved"));
  }
  function restoreFrom(text) {
    let parsed = null;
    try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
    const r = parsed ? C.sanitizeState(parsed, today()) : { ok: false };
    if (!r.ok) { closeModal(true); openModal(t("backupRestore"), `<p role="alert">${te("backupBad")}</p><div class="sheet-foot"><button type="button" class="btn primary" data-act="close">${te("close")}</button></div>`); return; }
    const when = parsed.exported ? dateLabel(C.todayLocal(new Date(parsed.exported))) : "?";
    confirmBox(t("backupRestoreConfirm", { date: when }), t("backupRestore"), () => {
      S = r.state; S.setupDone = true;
      S.events.forEach((e) => { if (e.t > lastT) lastT = e.t; });
      if (S.anchor.t > lastT) lastT = S.anchor.t;
      tick(); UI.tab = "home"; commit(); toast(t("backupRestored"));
    });
  }
  function backupCopy() {
    const text = JSON.stringify(C.makeBackup(S, Date.now()));
    openModal(t("backupCopy"), `<p class="lead">${te("backupTextHint")}</p><textarea class="input" id="bk-text" readonly aria-label="${te("backupCopy")}">${esc(text)}</textarea>
      <div class="sheet-foot"><button type="button" class="btn ghost" data-act="close">${te("close")}</button><button type="button" class="btn primary" data-act="copyText">${icon("copy")}${te("copyBtn")}</button></div>`);
  }
  function copyText() {
    const ta = $("bk-text");
    if (!ta) return;
    const done = () => { S.settings.lastBackup = Date.now(); persist(); toast(t("backupCopied")); };
    ta.select();
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ } });
    else { try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ } }
  }
  function backupPaste() {
    openModal(t("backupPaste"), `<p class="lead">${te("backupPasteHint")}</p><textarea class="input" id="bk-paste" aria-label="${te("backupPaste")}"></textarea>${foot()}`,
      { submit: () => { const v = val("bk-paste"); restoreFrom(v); return false; } });
  }

  // ------------------------------------------------------------------ toast
  let toastTimer = null, toastUndo = null;
  function toast(msg, undo) {
    const el = $("toast");
    toastUndo = undo || null;
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">${te("undo")}</button>` : ""}`;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; toastUndo = null; }, undo ? 7000 : 3500);
  }

  // ------------------------------------------------------------------ actions
  function togglePaid(id, due) {
    const b = S.bills.find((x) => x.id === id);
    if (!b) return;
    const ex = C.billPaid(S, id, due);
    if (ex) { S.events = S.events.filter((e) => e !== ex); commit(); return; }
    const e = { id: "p" + uid(), type: "bill", amount: b.amount, date: C.fmt(today()), t: stamp(), billId: id, due };
    S.events.push(e); commit();
    toast(t("billPaidToast", { name: b.name }), () => { S.events = S.events.filter((x) => x.id !== e.id); commit(); });
  }

  const ACT = {
    tab: (el) => { UI.tab = el.getAttribute("data-tab"); UI.showMath = false; render(); const v = $("view"); if (v) v.focus({ preventScroll: true }); window.scrollTo(0, 0); },
    low: () => { S.settings.low = !S.settings.low; commit(); },
    math: () => { UI.showMath = !UI.showMath; render(); },
    spend: spendDialog, income: incomeDialog, balance: balanceDialog,
    qcat: (el) => quickSave(el.getAttribute("data-id")),
    pay: (el) => togglePaid(el.getAttribute("data-id"), el.getAttribute("data-due")),
    skip: (el) => { const b = S.bills.find((x) => x.id === el.getAttribute("data-id")); if (!b) return; b.skips.push(el.getAttribute("data-due")); commit(); toast(t("billSkippedToast", { name: b.name }), () => { b.skips = b.skips.filter((x) => x !== el.getAttribute("data-due")); commit(); }); },
    unskip: (el) => { const b = S.bills.find((x) => x.id === el.getAttribute("data-id")); if (b) { b.skips = b.skips.filter((x) => x !== el.getAttribute("data-due")); commit(); } },
    addBill: () => billDialog(null), editBill: (el) => billDialog(el.getAttribute("data-id")),
    delBill: (el) => { const b = S.bills.find((x) => x.id === el.getAttribute("data-id")); if (b) confirmBox(t("billDeleteConfirm", { name: b.name }), t("del"), () => { S.bills = S.bills.filter((x) => x !== b); commit(); toast(t("billDeleted")); }, true); },
    billsMode: (el) => { UI.billsMode = el.getAttribute("data-v"); render(); },
    calMove: (el) => { const k = +el.getAttribute("data-v"), c = C.addMonths(UI.cal.y, UI.cal.m, k); UI.cal = c; UI.calSel = C.fromYMD(c.y, c.m, 1); render(); },
    calDay: (el) => { UI.calSel = +el.getAttribute("data-v"); render(); },
    actMode: (el) => { UI.act = el.getAttribute("data-v"); render(); },
    editEvent: (el) => eventDialog(el.getAttribute("data-id")),
    delEvent: (el) => { const id = el.getAttribute("data-id"), e = S.events.find((x) => x.id === id); if (!e) return; S.events = S.events.filter((x) => x.id !== id); commit(); toast(t("entryDeleted"), () => { S.events.push(e); commit(); }); },
    addGoal: () => goalDialog(null), editGoal: (el) => goalDialog(el.getAttribute("data-id")),
    goalAdd: (el) => goalMoneyDialog(el.getAttribute("data-id"), false), goalTake: (el) => goalMoneyDialog(el.getAttribute("data-id"), true),
    delGoal: (el) => { const g = S.goals.find((x) => x.id === el.getAttribute("data-id")); if (g) confirmBox(t("goalDeleteConfirm", { name: g.name }), t("del"), () => { S.goals = S.goals.filter((x) => x !== g); commit(); }, true); },
    addDebt: () => debtDialog(null), editDebt: (el) => debtDialog(el.getAttribute("data-id")),
    delDebt: (el) => { const d = S.debts.find((x) => x.id === el.getAttribute("data-id")); if (d) confirmBox(t("debtDeleteConfirm", { name: d.name }), t("del"), () => { S.debts = S.debts.filter((x) => x !== d); commit(); }, true); },
    debtMethod: (el) => { S.debtMethod = el.getAttribute("data-v"); commit(true); },
    close: () => closeModal(),
    undo: () => { const u = toastUndo; $("toast").hidden = true; toastUndo = null; if (u) u(); },
    backupSave, backupCopy, backupPaste, copyText,
    backupRestore: () => { const f = $("restore-file"); if (f) { f.value = ""; f.click(); } },
    dismissBackup: () => { UI.dismissed.backup = true; render(); },
    dismissPay: () => { S.flags.payNote = ""; commit(true); },
    payYes: () => { R.pendingPaydays.forEach((d, i) => S.events.push({ id: "pay-" + C.fmt(d) + "-" + uid(), type: "income", amount: S.pay.amount, date: C.fmt(d), t: stamp(), auto: true })); S.pay.lastProcessed = C.fmt(R.pendingPaydays[R.pendingPaydays.length - 1]); commit(); },
    payNo: () => { S.pay.lastProcessed = C.fmt(R.pendingPaydays[R.pendingPaydays.length - 1]); commit(); },
    payOther: () => { const last = R.pendingPaydays[R.pendingPaydays.length - 1]; S.pay.lastProcessed = C.fmt(last); persist(); incomeDialog(); },
    catHide: (el) => { const c = S.cats.find((x) => x.id === el.getAttribute("data-id")); if (c) { c.hidden = !c.hidden; commit(true); } },
    catAdd: () => { const n = val("new-cat").trim(); if (!n) { $("new-cat").focus(); return; } S.cats.push({ id: "c" + uid(), name: n.slice(0, 40), icon: "star", hidden: false }); commit(true); },
    loadSample: () => confirmBox(t("dataSampleConfirm"), t("dataSample"), () => { S = sampleState(); UI.tab = "home"; commit(); }),
    clearAll: () => confirmBox(t("dataClearConfirm"), t("dataClear"), () => { S = freshState(); UI.onb = null; UI.tab = "home"; if (!DEMO) { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } } commit(); toast(t("dataCleared")); }, true),
    clearSample: () => { S = freshState(); UI.onb = null; persist(); render(); },
    demoSetup: () => { S = freshState(); UI.onb = null; render(); },
    useSample: () => { S = sampleState(); UI.tab = "home"; commit(); },
    onbNext: () => {
      const o = onbDraft();
      if (o.step > 0 && !onbValidate()) { render(); const f = document.querySelector("[aria-invalid=true], .err"); if (f) { const i = f.closest(".field") ? f.closest(".field").querySelector("input,select") : null; (i || f).focus && (i || f).focus(); } return; }
      if (o.step === 4) { onbFinish(); persist(); o.step = 5; render(); $("view").focus(); return; }
      o.step++; render(); const v = $("view"); if (v) v.focus({ preventScroll: true });
    },
    onbBack: () => { const o = onbDraft(); o.err = {}; o.step = Math.max(0, o.step - 1); render(); },
    onbFreq: (el) => { S.pay.freq = el.getAttribute("data-v"); render(); },
    onbCushion: (el) => { onbDraft().cushion = +el.getAttribute("data-v"); render(); },
    onbChip: (el) => {
      const o = onbDraft(), n = el.getAttribute("data-v"), ix = n ? o.bills.findIndex((b) => b.name === n) : -1;
      if (ix >= 0) o.bills.splice(ix, 1); else o.bills.push({ name: n, amount: "", due: "", repeat: "m1" });
      render();
      if (ix < 0) { const i = $("ob-" + (n ? "a" : "n") + (o.bills.length - 1)); if (i) i.focus(); }
    },
    onbRemove: (el) => { onbDraft().bills.splice(+el.getAttribute("data-v"), 1); render(); },
    onbGo: () => { UI.onb = null; UI.tab = "home"; commit(); }
  };

  // ------------------------------------------------------------------ events
  function bind() {
    document.addEventListener("click", (ev) => {
      const el = ev.target.closest("[data-act]");
      if (!el || el.disabled) return;
      if (el.tagName === "A") ev.preventDefault();
      const fn = ACT[el.getAttribute("data-act")];
      if (fn) { ev.preventDefault(); fn(el); }
    });
    document.addEventListener("submit", (ev) => {
      if (ev.target.id !== "m-form") return;
      ev.preventDefault();
      if (MODAL && MODAL.submit) { const ok = MODAL.submit(); if (ok === true && !$("modal").hidden && $("m-form") === ev.target) closeModal(); }
    });
    document.addEventListener("input", (ev) => {
      const el = ev.target, k = el.getAttribute && el.getAttribute("data-onb");
      if (k) {
        const o = onbDraft(), parts = k.split(".");
        if (parts[0] === "bills") o.bills[+parts[1]][parts[2]] = el.value; else o[k] = el.value;
        el.removeAttribute("aria-invalid");
      }
      if (el.getAttribute && el.getAttribute("aria-invalid") === "true" && el.closest("#m-form")) { el.removeAttribute("aria-invalid"); const er = el.closest(".field") && el.closest(".field").querySelector(".err"); if (er) er.remove(); }
    });
    document.addEventListener("change", (ev) => {
      const el = ev.target;
      if (el.id === "restore-file" && el.files && el.files[0]) {
        const fr = new FileReader();
        fr.onload = () => restoreFrom(String(fr.result || ""));
        fr.readAsText(el.files[0]);
        return;
      }
      const set = el.getAttribute && el.getAttribute("data-set");
      if (set) { setPath(set, el.type === "checkbox" ? el.checked : el.value, el); return; }
      const cn = el.getAttribute && el.getAttribute("data-cat-name");
      if (cn) { const c = S.cats.find((x) => x.id === cn); if (c) { c.name = el.value.trim().slice(0, 40); commit(true); } return; }
      if (el.getAttribute && el.getAttribute("data-onb") && el.tagName === "SELECT") { const o = onbDraft(), p = el.getAttribute("data-onb").split("."); if (p[0] === "bills") o.bills[+p[1]][p[2]] = el.value; }
    });
    document.addEventListener("keydown", (ev) => {
      const m = $("modal");
      if (m.hidden) return;
      if (ev.key === "Escape") { ev.preventDefault(); closeModal(); return; }
      if (ev.key === "Tab") {
        const f = [...m.querySelectorAll("button,input,select,textarea,summary,[tabindex]:not([tabindex='-1'])")].filter((x) => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
        else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
      }
    });
    $("modal").addEventListener("click", (ev) => { if (ev.target === $("modal")) closeModal(); });
    const refresh = () => { if (document.visibilityState === "visible" && S) { tick(); if ($("modal").hidden) render(); } };
    document.addEventListener("visibilitychange", refresh);
    window.addEventListener("storage", (ev) => { if (ev.key === KEY && ev.newValue && $("modal").hidden) { const r = C.sanitizeState(JSON.parse(ev.newValue), today()); if (r.ok) { S = r.state; render(); } } });
    if (window.matchMedia) { const mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", render); }
  }

  // test + video hooks (read-only helpers, no network)
  window.DEB_APP = { state: () => S, compute: () => C.compute(S, today()), render, toast, today };

  load();
  tick();
  bind();
  render();
})();
</script>
<script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js');});}</script>
</body>
</html>
