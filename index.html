<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Done Enough Co.</title>
<meta name="description" content="Calm, ADHD-friendly tools for home, money and work. Free demo of the Done Enough Budget app.">
<style>
  :root { --oat: #F3EDE4; --ink: #2F3437; --teal: #5E8C87; --apricot: #E9A87C; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--oat); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; }
  main { max-width: 560px; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: #fff; position: relative;
    display: grid; place-items: center; box-shadow: 0 6px 18px rgba(47,52,55,.1); color: var(--teal); }
  .mark i { position: absolute; right: 8px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--apricot); }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: 40px; margin: 0 0 10px; letter-spacing: -.5px; }
  p { font-size: 18px; line-height: 1.5; color: #5b6266; margin: 0 0 26px; }
  a.btn { display: inline-block; background: var(--teal); color: #fff; text-decoration: none; font-weight: 700;
    padding: 14px 24px; border-radius: 999px; font-size: 17px; }
  small { display: block; margin-top: 22px; color: #8a9094; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="mark"><svg width="40" height="40" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9"
    stroke-linecap="round" stroke-linejoin="round"><path d="M27 53 C33 57 39 63 44 70 C53 55 64 41 77 29"/></svg><i></i></div>
  <h1>Done Enough Co.</h1>
  <p>Calm, ADHD-friendly tools for home, money and work. Done is enough.</p>
  <a class="btn" href="budget-demo/">Try the free Budget App demo</a>
  <small>The demo runs in your browser with sample data. Nothing is saved or sent anywhere.</small>
</main>
</body>
</html>
